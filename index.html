function saveRun() {
  if (!run.active || !run.rogue) return;
  const children = {};
  run.rogue.layers.forEach(nodes => nodes.forEach(n => { children[n.id] = n.children.map(c => c.id); }));
  const data = {
    v: 4,
    difficulty: run.rogue.difficulty,
    luckBonus: run.luckBonus,
    heroAttr: run.heroAttr,
    pathIds: run.path.map(n => n.id),
    artifacts: run.artifacts.map(a => ({ id: a.id, count: a.count })),
    companions: run.companions.map(c => c.id),
    seed: run.seed,
    playerState: playerUnits.map(u => ({ charId: u.charId, hp: u.hp, maxHp: u.maxHp, atk: u.atk, def: u.def, maxDef: u.maxDef, sta: u.sta, maxSta: u.maxSta, mana: u.mana, maxMana: u.maxMana, alive: u.alive, permAtk: u.permAtk, permDef: u.permDef, permMaxHp: u.permMaxHp, permMaxSta: u.permMaxSta, permMaxMana: u.permMaxMana })),
    grantedLayers: run.grantedLayers.slice(),
    layers: run.rogue.layers.map(nodes => nodes.map(n => ({ id: n.id, type: n.type }))),
    children,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}

function hasSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    return !!(d && (d.v === 1 || d.v === 2 || d.v === 3 || d.v === 4) && Array.isArray(d.layers) && d.layers.length === RUN_LAYERS);
  } catch (e) {
    return false;
  }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function restoreRun() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!data) return;
  run.difficulty = data.difficulty;
  run.luckBonus = data.luckBonus || 0;
  run.heroAttr = data.heroAttr || 0;
  run.artifacts = (data.artifacts || []).map(a => ({ id: a.id, count: a.count, inApplied: false, outApplied: false }));
  run.companions = (data.companions || []).map(id => COMPANIONS.find(c => c.id === id)).filter(Boolean).slice(0, 2);
  run.rogue = RogueRun.fromJSON(data);
  run.grantedLayers = data.grantedLayers || [];
  run.seed = data.seed || Math.floor(Math.random() * 1e9);
  createPlayerUnits();
  const byChar = new Map(playerUnits.map(u => [u.charId, u]));
  const oldOrder = ['hero', ...(data.companions || [])];
  (data.playerState || []).forEach((s, i) => {
    let u = s.charId ? byChar.get(s.charId) : null;
    if (!u && i === 0) u = playerUnits[0];
    if (!u && data.v <= 2) u = byChar.get(oldOrder[i]);
    if (!u) u = playerUnits[i];
    if (!u) return;
    const { charId, ...rest } = s;
    Object.assign(u, rest);
  });
  if (data.v === 1) applyStartSwordPermanent();
  run.path = (data.pathIds || []).map(id => run.rogue.index.get(id)).filter(Boolean);
  if (run.path.length >= RUN_LAYERS) { clearSave(); return; }
  run.stageIndex = run.path.length;
  run.active = true;
  run.phase = 'choice';
  startScreen.classList.remove('show');

  updateTop();
  renderMap();
  renderRelicCard();
  showChoice();
}

function escapeMdHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineMd(s) {
  return escapeMdHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function renderRulesMarkdown(md) {
  const lines = String(md).replace(/\r\n/g, '\n').split('\n');
  const out = [];
  const isSep = line => /^\s*\|?\s*:?-{3,}/.test(line);
  const splitRow = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
  const isBlock = line => /^(#{1,3}\s|>\s?|---+\s*$|\|)/.test(line) || /^[-*]\s+/.test(line) || /^\d+\.\s+/.test(line);
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^###\s+/.test(line)) { out.push(`<h3>${inlineMd(line.replace(/^###\s+/, ''))}</h3>`); i++; continue; }
    if (/^##\s+/.test(line)) { out.push(`<h2>${inlineMd(line.replace(/^##\s+/, ''))}</h2>`); i++; continue; }
    if (/^#\s+/.test(line)) { out.push(`<h1>${inlineMd(line.replace(/^#\s+/, ''))}</h1>`); i++; continue; }
    if (/^---+\s*$/.test(line)) { out.push('<hr />'); i++; continue; }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '').trim()); i++; }
      out.push(`<blockquote>${inlineMd(buf.join(' '))}</blockquote>`);
      continue;
    }
    if (line.trim().startsWith('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(splitRow(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^[-*]\s+/, '')); i++; }
      out.push('<ul>' + items.map(t => `<li>${inlineMd(t)}</li>`).join('') + '</ul>');
      continue;
    }
    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\d+\.\s+/, '')); i++; }
      out.push('<ol>' + items.map(t => `<li>${inlineMd(t)}</li>`).join('') + '</ol>');
      continue;
    }
    const buf = [line.trim()];
    i++;
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i].trim())) { buf.push(lines[i].trim()); i++; }
    out.push(`<p>${inlineMd(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}

const MAP_MIN_W = 360;
const MAP_LAYER_H = 180;
const MAP_PAD_Y = 40;
let mapLabelItems = [];

function rowPercents(count) {
  if (count === 1) return [0.5];
  if (count === 2) return [1 / 3, 2 / 3];
  if (count === 3) return [0.25, 0.5, 0.75];
  return Array.from({ length: count }, (_, i) => (i + 0.5) / count);
}

function updateMapLabels() {
  const top = mapBody.scrollTop;
  for (const item of mapLabelItems) {
    item.el.style.top = `${item.y - top}px`;
  }
}

function renderMap() {
  mapBody.innerHTML = '';
  mapLayerLabels.innerHTML = '';
  mapLabelItems = [];
  if (!run.rogue) {
    mapInfo.textContent = '';
    return;
  }
  mapInfo.textContent = `难度 ${run.rogue.difficulty} · 幸运 ${run.rogue.luck}`;
  const opts = run.phase === 'battle' || run.phase === 'settle' ? [] : run.rogue.options(run.path);
  const root = run.rogue.layers[0][0];
  if (!root) return;

  const viewW = mapBody.clientWidth;
  const width = Math.max(MAP_MIN_W, viewW);
  const viewOffsetX = (width - viewW) / 2;
  const height = RUN_LAYERS * MAP_LAYER_H + MAP_PAD_Y * 2;
  const canvas = document.createElement('div');
  canvas.id = 'mapCanvas';
  canvas.className = 'map-canvas';
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  mapBody.appendChild(canvas);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  canvas.appendChild(svg);

  const pathSet = new Set(run.path);
  const current = run.path[run.path.length - 1] || null;
  for (const nodes of run.rogue.layers) {
    const percents = rowPercents(nodes.length);
    nodes.forEach((n, i) => {
      n._mx = viewOffsetX + percents[i] * viewW;
      n._my = MAP_PAD_Y + n.layer * MAP_LAYER_H + MAP_LAYER_H / 2;
    });
  }

  for (const nodes of run.rogue.layers) {
    for (const n of nodes) {
      for (const child of n.children) {
        const d = `M ${n._mx} ${n._my + 15} L ${child._mx} ${child._my - 15}`;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'map-edge' + (pathSet.has(n) && pathSet.has(child) ? ' active' : ''));
        svg.appendChild(path);
      }
    }
  }

  run.rogue.layers.forEach((nodes, layer) => {
    const label = document.createElement('div');
    label.className = 'map-layer-label';
    const y = MAP_PAD_Y + layer * MAP_LAYER_H + 8;
    label.textContent = `${layer + 1} 层`;
    mapLayerLabels.appendChild(label);
    mapLabelItems.push({ el: label, y });
    for (const n of nodes) {
      const chip = document.createElement('span');
      const taken = pathSet.has(n);
      const isOption = opts.includes(n);
      chip.className = `map-node t-${n.type}${taken ? ' taken' : ''}${isOption ? ' option' : ''}${n === current ? ' current' : ''}`;
      chip.style.left = `${n._mx - 48}px`;
      chip.style.top = `${n._my - 15}px`;
      chip.textContent = NODE_TYPES[n.type].name;
      canvas.appendChild(chip);
    }
  });

  const target = current || root;
  const center = () => {
    mapBody.scrollLeft = Math.max(0, width / 2 - viewW / 2);
    mapBody.scrollTop = Math.max(0, target._my - mapBody.clientHeight * 0.35);
    updateMapLabels();
  };
  center();
  requestAnimationFrame(center);
  setTimeout(center, 60);
}

mapBody.addEventListener('scroll', updateMapLabels, { passive: true });

function chooseNode(node) {
  run.path.push(node);
  renderMap();
  if (node.type === 'fight' || node.type === 'boss') {
    enterBattle();
    return;
  }
  if (node.type === 'rest') { doRest(); return; }
  if (node.type === 'event') { showEvent(); return; }
  run.phase = 'story';
  updateSide();

function enterBattle(level = null) {
  run.phase = 'battle';
  run.battleBackup = {
    player: playerUnits.map(u => ({ hp: u.hp, sta: u.sta, mana: u.mana, atk: u.atk, def: u.def, maxDef: u.maxDef, maxSta: u.maxSta, maxMana: u.maxMana, alive: u.alive, permAtk: u.permAtk, permDef: u.permDef, permMaxSta: u.permMaxSta, permMaxMana: u.permMaxMana })),
    artifacts: run.artifacts.map(a => ({ id: a.id, count: a.count })),
    grantedLayers: run.grantedLayers.slice(),
  };
  closeModal();
  updateSide();
  renderMap();
  if (level) {
    run.battleLevel = level;
    resetGame(level);
    return Promise.resolve();
  }
  run.battleLevel = null;
  openModal('加载关卡', '正在载入本层关卡…', []);
  return (async () => {
    try {
      const lvl = await loadLevelForLayer(run.stageIndex + 1);
      run.battleLevel = lvl;
      closeModal();
      resetGame(lvl);
    } catch (e) {
      closeModal();
      run.path.pop();
      run.battleLevel = null;
      run.phase = 'choice';
      showChoice();
      showToast(`关卡加载失败：${e.message}`);
    }
  })();
}

function restartBattle() {
  const b = run.battleBackup;
  if (b) {
    b.player.forEach((s, i) => { if (playerUnits[i]) Object.assign(playerUnits[i], s); });
    run.artifacts = b.artifacts.map(a => ({ id: a.id, count: a.count, inApplied: false, outApplied: false }));
    run.grantedLayers = b.grantedLayers.slice();
  }
  resetGame(run.battleLevel);
}

function advance() {

function addArtifact(id) {
  const a = ARTIFACTS[id];
  if (!a) return;
  const inst = run.artifacts.find(x => x.id === id);
  if (inst) inst.count += 1;
  else run.artifacts.push({ id, count: 1, inApplied: false, outApplied: false });
  if (a.luckBonus) run.luckBonus += a.luckBonus;
  renderRelicCard();
}

function artifactKindText(a) {
  const k = ARTIFACT_KINDS[a.kind];
  if (a.kind === 'in') return `${k.name}类·${a.timing === 'start' ? '开场' : '行动后'}`;
  if (a.kind === 'gain') return '获得时生效';
  return `${k.name}类`;
}

function renderRelicCard() {
  relicCard.style.display = run.active ? '' : 'none';
  relicCount.textContent = run.artifacts.reduce((n, a) => n + a.count, 0);
  relicList.innerHTML = '';
  if (!run.artifacts.length) {
    relicList.innerHTML = '<div class="rd">暂无藏品</div>';
    return;
  }
  for (const inst of run.artifacts) {
    const a = ARTIFACTS[inst.id];
    const kind = ARTIFACT_KINDS[a.kind];
    const active = a.kind === 'in' && inst.inApplied && run.phase === 'battle';
    const item = document.createElement('div');
    item.className = 'relic-item';
    item.innerHTML = `<span class="rn">${a.name}${a.kind === 'once' ? ` ×${inst.count}` : ''}</span>
      <span class="rk" style="color:${kind.color}">${artifactKindText(a)}${active ? ' · 本场已生效' : ''}</span>
      <span class="rd">${a.desc}</span>`;
    relicList.appendChild(item);
  }
}

function triggerOutOfBattle() {
  for (const inst of run.artifacts) {
    const a = ARTIFACTS[inst.id];
    if (a.kind === 'out') a.onNodeConfirm?.(inst);
  }
}

function triggerBattleStart() {
  for (const inst of run.artifacts) {
    const a = ARTIFACTS[inst.id];
    if (a.kind === 'in' && a.timing === 'start') a.onBattleStart?.(inst);
  }
}

function triggerInBattle(actor) {
  for (const inst of run.artifacts) {
    const a = ARTIFACTS[inst.id];
    if (a.kind === 'in' && a.timing === 'action') a.onUnitAct?.(inst, actor);
  }
}

function useOnceArtifact(id, target) {
  const inst = run.artifacts.find(x => x.id === id);
  if (!inst || inst.count <= 0) return;
  const actor = currentActor();
  if (!actor || state.phase !== 'decision' || actor.camp !== 0 || state.onceUsed) return;
  const a = ARTIFACTS[id];
  if (a.target && !target) return;
  state.onceUsed = true;
  inst.count -= 1;
  a.use?.(target);
  if (inst.count <= 0) run.artifacts = run.artifacts.filter(x => x !== inst);
  pendingRelic = null;
  updateAll();
  renderRelicCard();
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rnd(tag) {
  let h = 2166136261 ^ (run.seed >>> 0);
  const s = String(tag);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 1274126177); h ^= h >>> 16;
  return ((h >>> 0) % 1000000) / 1000000;
}

function pickSeeded(arr, tag) {
  return arr[Math.floor(rnd(tag) * arr.length) % arr.length];
}

function shuffleSeeded(arr, tag) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd(tag + ':' + i) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function grantArtifact(id, opts = {}) {
  const a = ARTIFACTS[id];
  if (!a) return { ok: false, reason: '无此藏品' };
  const total = run.artifacts.reduce((n, x) => n + x.count, 0);
  if (total >= CONFIG.artifact.capacity) return { ok: false, reason: `藏品已满（${CONFIG.artifact.capacity}）` };
  if (!opts.ignoreLayer && run.grantedLayers.includes(run.stageIndex)) return { ok: false, reason: '本层已获得过藏品' };
  if (!run.grantedLayers.includes(run.stageIndex)) run.grantedLayers.push(run.stageIndex);
  const inst = run.artifacts.find(x => x.id === id);
  if (inst) inst.count += 1;
  else run.artifacts.push({ id, count: 1, inApplied: false, outApplied: false });
  a.onGain?.();
  renderRelicCard();
  return { ok: true };
}

function healParty(n) {
  playerUnits.filter(u => u.alive).forEach(u => { u.hp = Math.min(u.maxHp, u.hp + n); });
}

function growPartyMaxHp(n) {
  playerUnits.forEach(u => {
    u.permMaxHp = (u.permMaxHp || 0) + n;
    u.maxHp += n;
    if (u.alive) u.hp = Math.min(u.maxHp, u.hp + n);
  });
}

function restoreBattleStats() {
  playerUnits.forEach(u => {
    const s = u.battleSnapshot;
    if (!s) return;
    u.atk = s.atk;
    u.def = s.def;
    if (s.maxDef !== undefined) u.maxDef = s.maxDef;
    u.maxSta = s.maxSta;
    u.maxMana = s.maxMana;
    u.sta = Math.min(u.sta, u.maxSta);
    u.mana = Math.min(u.mana, u.maxMana);
    u.battleSnapshot = null;
  });
}

  const hpGain = lucky === 0 ? 2 : 1;
  const atkGain = lucky === 1 ? 4 : 2;
  const buttons = [
    {
      label: `全队生命上限 +${hpGain}${lucky === 0 ? '（幸运）' : ''}`,

function heroSkillList() {

function createPlayerUnits() {

  const chosen = run.companions.length ? run.companions.slice(0, 2) : COMPANIONS.slice(0, 2);
  const defs = [
    { id: 'hero', name: '主角', attr: heroAttr, skills: heroSkillList(), stats: CONFIG.player },

function applyStartSwordPermanent() {
  for (const id of ['ganjiang', 'moye']) {
    if (!run.artifacts.some(a => a.id === id)) continue;
    ARTIFACTS[id].onGain?.();
  }
}

function scaleLevelEnemyStats(e, layer, isBoss) {
  const diffMul = CONFIG.scaling.base + (run.difficulty - 1) * CONFIG.scaling.difficulty;
  const layerMul = isBoss ? 1 : 1 + (layer - 1) * CONFIG.scaling.layer;
  const scale = v => {
    const n = Number(v);
    if (!Number.isFinite(n)) return 0;
    return Math.max(0, Math.floor(Math.floor(n * diffMul) * layerMul));
  };
  return {
    hp: Math.max(1, scale(e.hp)),
    atk: scale(e.atk),
    def: scale(e.def),
    sta: scale(e.sta),
    mana: scale(e.mana),
    atkRange: Math.max(1, Math.round(Number(e.atkRange) || 1)),
  };
}

function applyLevelCells(level) {
  for (let i = 0; i < cells.length; i++) {
    const v = Array.isArray(level.cells) ? level.cells[i] : null;
    const attr = Number.isInteger(v) && v >= 0 && v <= 4 ? v : null;
    cells[i].baseAttr = attr;
    cells[i].attr = attr;
  }
}

const BOSS_DIAMOND_IDS = [1, 2, 3, 41];

function createBoss(id, partCells, stats, attr = 0) {
  const boss = new Unit(id, 'BOSS', 1, attr, partCells[0], [], { ...stats }, 5);
  boss.isBoss = true;
  boss.cells = partCells.slice();
  boss.bossParts = partCells.map((c, i) => ({ cell: c, hit: false, pending: false, index: i }));
  boss.enraged = false;
  return boss;
}

function buildLevelEnemies(level, layer) {
  const out = [];
  const used = new Set();
  const baseId = playerUnits.length;
  const list = Array.isArray(level.enemies) ? level.enemies : [];
  for (const e of list) {
    if (!e || typeof e !== 'object') continue;
    const tplId = ENEMY_TEMPLATES[Number(e.template)] ? Number(e.template) : 1;
    const isBoss = tplId === 5 || (Array.isArray(e.cells) && e.cells.length === 4);
    const attr = Number.isInteger(e.attr) && e.attr >= 0 && e.attr <= 4 ? e.attr : 0;
    if (isBoss) {
      const ids = Array.isArray(e.cells) && e.cells.length === 4 ? e.cells : BOSS_DIAMOND_IDS;
      const partCells = ids.map(id => cells[id]).filter(Boolean);
      if (partCells.length !== 4) throw new Error(`BOSS 四格位置无效（${level.name || '关卡'}）`);
      if (partCells.some(c => used.has(c.id))) throw new Error(`BOSS 四格位置重叠（${level.name || '关卡'}）`);
      partCells.forEach(c => used.add(c.id));
      out.push(createBoss(baseId + out.length, partCells, scaleLevelEnemyStats(e, layer, true), attr));
    } else {
      const c = cells[e.cell];
      if (!c || used.has(c.id)) throw new Error(`敌人位置无效或重叠（${level.name || '关卡'}）`);
      used.add(c.id);
      const tpl = ENEMY_TEMPLATES[tplId] || ENEMY_TEMPLATES[1];
      const nm = tplId === 1 ? `敌人${out.length + 1}` : `${tpl.unitName}${out.length + 1}`;
      out.push(new Unit(baseId + out.length, nm, 1, attr, c, BASIC_SKILLS.slice(), scaleLevelEnemyStats(e, layer, false), tplId));
    }
  }
  if (!out.length) throw new Error(`关卡没有敌人（${level.name || '关卡'}）`);
  return out;
}

function resetGame(level = run.battleLevel) {
  if (!level) {
    showToast('没有可加载的关卡');
    return;
  }
  units.forEach(u => { if (u.mesh) scene.remove(u.mesh); });
  hideDossier();

  const enemies = buildLevelEnemies(level, layer);

  playerUnits.forEach(u => {
    u.cell = spawnCell(u.attr);
    u.status = new UnitStatus();
    u.skipped = false;
    u.damageThisRound = 0;
    u.damageImmune = false;
    u.skillCostUses = {};
    u.skillOnceUsed = {};

    u.hp = u.maxHp;
    u.sta = u.maxSta;
    u.mana = u.maxMana;
    u.battleSnapshot = { atk: u.atk, def: u.def, maxDef: u.maxDef, maxSta: u.maxSta, maxMana: u.maxMana };
  });
  enemies.forEach(e => { e.instant = true; });
  units = [...playerUnits, ...enemies];

  Object.assign(state, {
    round: 1, phase: 'deploy', over: false, onceUsed: false,

  });

function cellOccupiedByUnit(cell, exceptUnit) {
  return units.some(u => u !== exceptUnit && unitOccupiesCell(u, cell));
}

function enemyOnCell(cell) {
  return units.some(u => u.camp === 1 && unitOccupiesCell(u, cell));
}

function deployUnit() {
  return deployment ? deployment.order[deployment.index] || null : null;
}

function deployReady() {
  return !!deployment && deployment.index >= deployment.order.length;
}

function deployableCells(u) {
  return cells.filter(c => !cellOccupiedByUnit(c, u));
}

function startDeployment() {
  const order = playerUnits.filter(u => u.alive);
  const defaults = new Map();
  const used = new Set();
  for (const u of order) {
    let cell = spawnCell(u.attr);
    if (!cell || used.has(cell.id) || enemyOnCell(cell)) {
      const from = cell || cells[0];
      const free = cells
        .filter(c => !used.has(c.id) && !enemyOnCell(c))
        .sort((a, b) => stepDist(a, from) - stepDist(b, from));
      cell = free[0] || cell;
    }
    if (!cell) continue;
    used.add(cell.id);
    defaults.set(u.id, cell.id);
  }
  deployment = { order, index: 0, defaults };
  if (!order.length) { finishDeployment(true); return; }
  for (const u of order) {
    const c = cells[defaults.get(u.id)];
    if (!c) continue;
    u.instant = true;
    moveUnit(u, c);
  }
  layoutUnits();
  state.phase = 'deploy';
  log('—— 布阵阶段 ——', 'round');
  log('请依次为主角团选择起始位置', 'note');
  updateAll();
}

function placeCurrent(cell) {
  const u = deployUnit();
  if (!u || !cell) return;
  if (cellOccupiedByUnit(cell, u)) return;
  moveUnit(u, cell);
  log(`布阵：${u.name} → ${cell.label}`, 'note');
  deployment.index += 1;
  updateAll();
}

function selectDeployUnit(u) {
  if (!deployment) return;
  const i = deployment.order.indexOf(u);
  if (i < 0) return;
  deployment.index = i;
  updateAll();
}

function resetDeployment() {
  if (!deployment) return;
  for (const u of deployment.order) {
    const c = cells[deployment.defaults.get(u.id)];
    if (!c) continue;
    u.instant = true;
    moveUnit(u, c);
  }
  deployment.index = 0;
  layoutUnits();
  updateAll();
}

function finishDeployment(silent) {
  if (!silent && !deployReady()) return;
  if (!silent) log('布阵完成，战斗开始', 'round');
  if (units.some(u => u.isBoss)) {
    log('【BOSS · 双头食人花】<br>鞭挞：2魔，攻击至多两名目标；穿刺：2魔，无视防御；压制：2魔，1点伤害并施加无力；爆发：2魔，全部格转为 BOSS 属性；抽取：抽取每名敌人 1 魔并回复自身；反击：防御时反伤 1 点并回复 1 魔。<br>四格根须首次受击后，回合末各损失 1/8 最大生命；半血后狂暴，攻击 +50%。', 'boss');
  }
  deployment = null;
  triggerBattleStart();
  startRound();
  updateAll();
}

restartBtn.addEventListener('click', () => {
  if (!(run.active && run.phase === 'battle')) return;
  restartBattle();
  onResize();
});
bannerBtn.addEventListener('click', () => { resetGame(run.battleLevel); onResize(); });

const heartbeat = () => fetch('/__hb', { cache: 'no-store' }).catch(() => {});
heartbeat();
const beatTimer = setInterval(heartbeat, 2000);
window.addEventListener('pagehide', () => {
  try { navigator.sendBeacon('/__bye'); } catch (e) {}
});

shutdownBtn.addEventListener('click', async () => {
  if (serverDown) return;
  serverDown = true;
  shutdownBtn.disabled = true;
  shutdownBtn.textContent = '正在关闭…';
  clearInterval(beatTimer);
  try { await fetch('/__shutdown', { cache: 'no-store' }); } catch (e) {}
  shutdownBtn.textContent = '服务已关闭';
  updateAll();
});

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;
  for (const u of units) {
    if (u.mesh && u.target) u.mesh.position.lerp(u.target, 0.2);
    if (u.mesh && u.alive) {
      const gems = u.mesh.userData.gems || [u.mesh.userData.gem];
      for (const gem of gems) if (gem) gem.rotation.y = t * 0.6;
    }
  }
  if (state.currentUnitId !== null && !state.over) {
    const u = units[state.currentUnitId];
    if (u && u.mesh && u.alive) {
      const s = 1 + Math.sin(t * 4) * 0.03;
      u.mesh.children[2].scale.setScalar(s);
    }
  }
  renderer.render(scene, camera);
}

window.__game = {
  cells,
  get units() { return units; },
  get state() { return state; },
  get run() { return run; },
  get playerUnits() { return playerUnits; },
  get deployment() { return deployment; },
  deployableCells,
  finishDeployment,
  commit: d => commit(d),
  validTargets,
  validCells,
  stepDist,
  unitGap,
  skills: SKILL_MAP,
  modifier: modifierParts,
  enemyTemplates: ENEMY_TEMPLATES,
  enemyActions: ENEMY_ACTIONS,
  enemyMethodIndex: ENEMY_METHOD_INDEX,
  bossDiamond: BOSS_DIAMOND_IDS,
  createBoss,
  moveUnit,
  layoutUnits,
};

onResize();
renderStart();
updateSide();
renderMap();
renderRelicCard();
updateTop();
startScreen.classList.add('show');
animate();
</script>
</body>
</html>
