<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>五行棋盘 · 计划2</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05080e; color: #dbe3f0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none;
  }
  #app {
    display: grid; height: 100vh; gap: 1px; background: #1c2534;
    grid-template-columns: 1fr 348px;
    grid-template-rows: 54px 1fr 154px;
  }
  header {
    grid-column: 1 / 3; grid-row: 1;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: linear-gradient(180deg, #121a28, #0d131e);
  }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: 3px; color: #e8eefb; }
  .brand span { font-size: 11px; letter-spacing: 1px; color: #5c708f; margin-left: 6px; }
  #phaseInfo { font-size: 13px; color: #8fa6c8; min-width: 180px; }
  #runInfo { font-size: 12px; color: #7f93b0; white-space: nowrap; }
  #orderList { display: flex; gap: 6px; flex: 1; font-size: 12px; flex-wrap: wrap; }
  .order-chip {
    padding: 3px 9px; border-radius: 20px; background: #17202e;
    border: 1px solid #253247; color: #7d8ea8;
  }
  .order-chip.now { background: #1f3550; border-color: #4a7fb5; color: #d6e9ff; }
  .order-chip[data-camp="0"] { box-shadow: inset 0 -2px 0 #4fd1e8; }
  .order-chip[data-camp="1"] { box-shadow: inset 0 -2px 0 #f06b6b; }
  .order-chip.skip { opacity: .4; text-decoration: line-through; }
  #restartBtn, #shutdownBtn {
    background: #1b2637; color: #a9bcd8; border: 1px solid #2b3a52;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  #restartBtn:hover { background: #223147; color: #dbe9ff; }
  #shutdownBtn {
    background: #241a1f; color: #c79aa4; border: 1px solid #3d2a33;
  }
  #shutdownBtn:hover:not(:disabled) { background: #33202a; color: #f0c3cc; border-color: #6b3d4a; }
  #shutdownBtn:disabled { opacity: .45; cursor: default; }

  #stage {
    grid-column: 1; grid-row: 2; position: relative; overflow: hidden;
    background: #05080e;
  }
  #bgVideo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 0; pointer-events: none;
    opacity: .9; filter: saturate(1) brightness(.82) blur(.5px);
  }
  #bgShade {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 50% 38%, rgba(8, 14, 24, .04) 0%, rgba(5, 8, 14, .28) 70%),
      linear-gradient(180deg, rgba(5, 8, 14, .12), rgba(5, 8, 14, .34));
  }
  #stage canvas {
    display: block; position: absolute; inset: 0; z-index: 2;
    background: transparent;
  }
  #skillCard { z-index: 6; }
  #hint {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #a9c7ee; padding: 7px 18px; border-radius: 20px;
    background: rgba(10, 18, 30, 0.78); border: 1px solid #23374f;
    pointer-events: none; white-space: nowrap;
  }
  #victoryCinematic {
    position: absolute; inset: 0; z-index: 28; display: none;
    background: #05080e; overflow: hidden;
  }
  #victoryCinematic.show { display: block; }
  #victoryCinematic video {
    position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  }
  #victoryVideoBackdrop {
    z-index: 0; object-fit: cover;
    filter: blur(18px) brightness(.48) saturate(.9);
    transform: scale(1.08);
  }
  #victoryVideo { z-index: 1; object-fit: contain; }
  #winPrompt {
    position: absolute; inset: 0; z-index: 29;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 20px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, visibility .18s;
  }
  #winPrompt.show { opacity: 1; visibility: visible; }
  #winPrompt .win-box {
    width: min(174px, 24%); overflow: hidden; border-radius: 10px;
    background: var(--modal); border: 2px solid var(--line-blue);
    box-shadow: 0 0 0 2px rgba(216, 180, 90, .35), 0 20px 50px rgba(0, 0, 0, .5);
  }
  #winPrompt img { display: block; width: 100%; height: auto; mix-blend-mode: multiply; }
  #skillCard {
    position: absolute; top: 16px; right: 16px; width: 272px;
    padding: 12px 14px; border-radius: 10px; pointer-events: none;
    background: rgba(12, 20, 32, 0.9); border: 1px solid #2a3d56;
    backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    transition: opacity .12s, transform .12s;
  }
  #skillCard.hidden { opacity: 0; transform: translateY(-6px); }
  .sc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #scCat {
    font-size: 10px; letter-spacing: 2px; padding: 2px 7px;
    border-radius: 4px; background: #1b2739; color: #9db6d6;
  }
  #scName { font-size: 14px; font-weight: 600; color: #e6eefb; }
  .sc-cost { font-size: 11px; color: #e0b25c; margin-bottom: 6px; }
  .sc-desc { font-size: 12px; line-height: 1.7; color: #a7bcd8; }

  #toast {
    position: absolute; top: 18px; left: 50%; z-index: 12;
    transform: translateX(-50%) translateY(-8px);
    padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #ffe6b0;
    background: rgba(40, 30, 12, .92); border: 1px solid #6b5320;
    opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #relicCard {
    position: absolute; top: 16px; left: 16px; width: 232px; z-index: 5;
    background: rgba(12, 20, 32, .9); border: 1px solid #2a3d56; border-radius: 10px;
    backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    overflow: hidden; font-size: 12px;
  }
  #relicHead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; cursor: pointer; letter-spacing: 2px; color: #cfe0f6;
    background: #0e1726;
  }
  #relicHead b { color: #e0b25c; }
  #relicList {
    padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 7px;
    max-height: 320px; overflow-y: auto;
  }
  #relicCard.collapsed #relicList { display: none; }
  .relic-item { display: flex; flex-direction: column; gap: 1px; }
  .relic-item .rn { color: #e6eefb; font-weight: 600; }
  .relic-item .rk { font-size: 10px; color: #7f93b0; }
  .relic-item .rd { font-size: 11px; color: #93a6c2; line-height: 1.5; }

  .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick-grid.three { grid-template-columns: repeat(3, 1fr); }
  .pick-grid.three .pick-card { padding: 10px 8px; }
  .pick-grid.three .pc-name { font-size: 13px; }
  .pick-grid.three .pc-desc { font-size: 11px; }
  .pick-grid.four { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pick-grid.four .pick-card {
    padding: 8px; display: flex; flex-direction: column; gap: 7px; text-align: center;
  }
  .pick-grid.sword .pick-card {
    padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;
  }
  .pick-grid.sword .pc-name { text-align: center; margin-bottom: 0; }
  .pick-grid.sword .pc-kind { text-align: center; margin-bottom: 2px; }
  .pick-grid.sword .pc-desc { font-size: 11px; line-height: 1.55; }
  .pc-portrait {
    aspect-ratio: 3 / 4; overflow: hidden; border-radius: 8px;
    background: #0a121d; border: 1px solid #223247;
  }
  .pc-portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .pc-head {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 14px; font-weight: 700; color: #eaf2ff; white-space: nowrap;
  }
  .pc-attr {
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
    background: color-mix(in srgb, var(--attr) 20%, transparent); color: var(--attr);
  }
  #modal.companion-pick .modal-box { width: 900px; }
  #modal.sword-pick .modal-box { width: 600px; }
  .pick-card {
    text-align: left; padding: 12px; border-radius: 10px; cursor: pointer;
    background: #141d2b; border: 1px solid #24344a; color: #c6d6ea;
    font-family: inherit; transition: all .12s;
  }
  .pick-card:hover { background: #1d2a3d; border-color: #4a7fb5; }
  .pick-card.selected { background: #1d2e46; border-color: #5d92c9; box-shadow: 0 0 0 1px #3a648f inset; }
  .pc-name { font-size: 15px; font-weight: 700; color: #eaf2ff; margin-bottom: 4px; }
  .pc-kind { font-size: 10px; letter-spacing: 1px; margin-bottom: 6px; }
  .pc-desc { font-size: 12px; color: #93a6c2; line-height: 1.6; }

  #banner {
    position: absolute; inset: 0; display: none; place-items: center;
    background: rgba(4, 7, 12, 0.72); backdrop-filter: blur(3px);
  }  #banner.show { display: grid; }
  #banner .box {
    text-align: center; padding: 34px 52px; border-radius: 16px;
    background: #101a2a; border: 1px solid #2b4364; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  #banner h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: 4px; }
  #banner p { margin: 0 0 18px; font-size: 13px; color: #8fa6c8; }
  #banner button {
    padding: 9px 26px; border-radius: 8px; cursor: pointer; font-family: inherit;
    background: #1f3550; border: 1px solid #4a7fb5; color: #d6e9ff; font-size: 13px;
  }

  #side {
    grid-column: 2; grid-row: 2 / 4;
    display: flex; flex-direction: column; background: #0a111c;
    border-left: 1px solid #1c2534; min-height: 0;
  }
  #mapPanel {
    flex: 6 1 0; min-height: 0; display: flex; flex-direction: column;
    border-bottom: 1px solid #1c2534;
  }
  #mapViewport { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  #mapBody {
    position: absolute; inset: 0 0 0 38px; overflow: auto; padding: 0;
  }
  #mapBody::-webkit-scrollbar { width: 7px; height: 7px; }
  #mapBody::-webkit-scrollbar-thumb { background: #22304a; border-radius: 3px; }
  #mapLayerLabels {
    position: absolute; left: 0; top: 0; bottom: 0; width: 38px; z-index: 4;
    pointer-events: none; overflow: hidden;
    background: linear-gradient(90deg, rgba(10, 17, 28, .96), rgba(10, 17, 28, .65));
  }
  #mapCanvas { position: relative; }
  #mapCanvas svg { position: absolute; inset: 0; pointer-events: none; }
  .map-edge { fill: none; stroke: #2f4d70; stroke-width: 1.2; opacity: .5; }
  .map-edge.active { stroke: #5b9bd5; opacity: .9; }
  .map-canvas .map-node {
    position: absolute; width: 96px; height: 30px; padding: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; white-space: nowrap;
  }
  .map-canvas .map-node.current { background: #1f3550; color: #fff; border-color: #6fa5d6; box-shadow: 0 0 0 1px #4a7fb5; }
  .map-layer-label { position: absolute; left: 8px; font-size: 10px; color: #405675; transform: translateY(-50%); }
  .map-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .map-idx { width: 16px; text-align: right; font-size: 10px; color: #55688a; }
  .map-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .map-node {
    font-size: 11px; padding: 4px 10px; border-radius: 14px;
    background: #141d2b; border: 1px solid #24344a; color: #7d8ea8;
  }
  .map-node.t-fight { color: #e8917f; border-color: #4a2b33; }
  .map-node.t-event { color: #b79df0; border-color: #3d2f5c; }
  .map-node.t-rest { color: #79c7a5; border-color: #2b4a3d; }
  .map-node.t-boss { color: #e8c05a; border-color: #4a3d22; }
  .map-node.option { color: #fff; box-shadow: 0 0 0 1px currentColor; background: #1a2637; }
  .map-node.taken { background: #1f3550; color: #d6e9ff; border-color: #4a7fb5; box-shadow: none; }
  .map-row.current .map-idx { color: #9fc2ef; font-weight: 700; }
  #skillPanel {
    flex: 6 1 0; min-height: 0; display: flex; flex-direction: column;
    border-bottom: 1px solid #1c2534;
  }
  .sp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; font-size: 13px; color: #cfe0f6;
    background: #0e1726; border-bottom: 1px solid #1a2434;
  }
  .sp-head small { color: #6f86a6; font-size: 11px; }
  #spBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 10px 8px; }
  #spFoot {
    flex: 0 0 auto; padding: 10px 12px 12px;
    background: #0d1624; border-top: 1px solid #1a2434;
  }
  #draftInfo {
    font-size: 11px; color: #7f93b0; margin-bottom: 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #draftInfo b { color: #cfe0f6; font-weight: 500; }
  #confirmBtn {
    width: 100%; padding: 11px; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, #3f7fb5, #2c5f8f);
    border: 1px solid #6fa5d6; color: #f2f8ff; font-family: inherit;
    font-size: 14px; font-weight: 700; letter-spacing: 3px;
    box-shadow: 0 4px 14px rgba(40, 110, 170, .35); transition: all .12s;
  }
  #confirmBtn:hover:not(:disabled) { background: linear-gradient(180deg, #4a90c9, #33679a); }
  #confirmBtn:disabled { opacity: .32; cursor: not-allowed; box-shadow: none; }
  #spBody::-webkit-scrollbar, #log::-webkit-scrollbar { width: 6px; }
  #spBody::-webkit-scrollbar-thumb, #log::-webkit-scrollbar-thumb { background: #22304a; border-radius: 3px; }
  .sp-group { margin-top: 5px; }
  .sp-cat {
    font-size: 10px; letter-spacing: 3px; color: #5d7fae; margin: 0 0 3px 2px;
  }
  .sp-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .skill {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 8px; border-radius: 7px; cursor: pointer; text-align: left;
    background: #141d2b; border: 1px solid #24344a; color: #c6d6ea;
    font-family: inherit; font-size: 12px; transition: all .1s;
  }
  .skill small { color: #6b80a0; font-size: 10px; white-space: nowrap; }
  .skill:hover:not(:disabled) { background: #1d2a3d; border-color: #3f6a9c; color: #eaf2ff; }
  .skill:disabled { opacity: .28; cursor: not-allowed; }
  .skill.active { background: #1d2e46; border-color: #5d92c9; box-shadow: 0 0 0 1px #3a648f inset; color: #eaf2ff; }
  .sp-empty { padding: 18px 12px; font-size: 12px; color: #6f86a6; line-height: 1.8; }
  .deploy-list { display: flex; flex-direction: column; gap: 5px; margin: 4px 0 8px; }
  .deploy-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 9px; border-radius: 8px; cursor: pointer; text-align: left;
    background: #121b29; border: 1px solid #223146; color: #b9cbe2;
    font-family: inherit; font-size: 12px; transition: all .1s;
  }
  .deploy-row:hover { border-color: #3f6a9c; }
  .deploy-row.current { border-color: #5d92c9; background: #1a2940; box-shadow: 0 0 0 1px #3a648f inset; }
  .deploy-row .dn { color: var(--attr); font-weight: 700; }
  .deploy-row .da { color: #6f86a6; font-size: 10px; }
  .deploy-row .dc { margin-left: auto; color: #8fa6c8; font-size: 11px; }
  .deploy-row.current .dc { color: #eaf2ff; }
  .deploy-actions { display: flex; gap: 6px; margin-top: 2px; }
  .deploy-actions button {
    flex: 1; padding: 7px 8px; border-radius: 7px; cursor: pointer;
    background: #141d2b; border: 1px solid #24344a; color: #9fb4d1;
    font-family: inherit; font-size: 11px;
  }
  .deploy-actions button:hover:not(:disabled) { background: #1d2a3d; border-color: #3f6a9c; color: #eaf2ff; }
  .deploy-actions button:disabled { opacity: .32; cursor: not-allowed; }
  .deploy-tip { padding: 6px 2px 2px; }
  .deploy-tip b { color: #cfe0f6; }

  #startScreen {
    position: fixed; inset: 0; z-index: 60; display: none; place-items: center;
    background: radial-gradient(circle at 50% 40%, #142033 0%, #05080e 70%);
  }
  #startScreen.show { display: grid; }
  .start-card {
    width: 460px; padding: 40px 42px 34px; border-radius: 18px; text-align: center;
    background: rgba(16, 26, 42, .94); border: 1px solid #2b4364;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  }
  .start-title { font-size: 30px; letter-spacing: 10px; font-weight: 700; color: #e8f0ff; }
  .start-sub { margin-top: 8px; font-size: 12px; letter-spacing: 3px; color: #5d7fae; }
  .diff-block { margin: 30px 0 6px; }
  .diff-label { font-size: 12px; letter-spacing: 3px; color: #8fa6c8; margin-bottom: 10px; }
  .diff-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .diff-row button {
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 12px;
    background: #1b2637; border: 1px solid #2b3a52; color: #a9bcd8;
  }
  .diff-row button:hover { background: #223147; color: #dbe9ff; }
  #diffVal { font-size: 30px; font-weight: 700; color: #cfe4ff; min-width: 54px; }
  .start-note { font-size: 12px; color: #6f86a6; margin: 14px 0 26px; }
  .start-note b { color: #e0b25c; font-weight: 600; }
  #startBtn {
    width: 100%; padding: 13px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #3f7fb5, #2c5f8f); border: 1px solid #6fa5d6;
    color: #f2f8ff; font-size: 15px; font-weight: 700; letter-spacing: 6px; font-family: inherit;
    box-shadow: 0 6px 20px rgba(40, 110, 170, .35);
  }
  #startBtn:hover { background: linear-gradient(180deg, #4a90c9, #33679a); }
  #continueBtn {
    width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
    background: #1b2637; border: 1px solid #2b3a52; color: #a9bcd8;
    font-size: 13px; letter-spacing: 4px; font-family: inherit;
  }
  #continueBtn:hover { background: #223147; color: #dbe9ff; }

  .attr-wheel { display: flex; justify-content: center; }
  .attr-wheel svg { width: 300px; height: 300px; }
  .attr-node { cursor: pointer; }
  .attr-node circle { transition: all .12s; }
  .attr-node:hover circle { fill-opacity: .32; }
  .attr-node.selected circle { stroke-width: 4; fill-opacity: .45; }

  #modal {
    position: absolute; inset: 0; z-index: 30; display: none; place-items: center;
    background: rgba(4, 7, 12, .62); backdrop-filter: blur(3px);
  }
  #modal.show { display: grid; }
  .modal-box {
    width: 520px; max-width: calc(100vw - 40px); padding: 26px 28px 22px; border-radius: 14px;
    background: #101a2a; border: 1px solid #2b4364; box-shadow: 0 24px 70px rgba(0, 0, 0, .6);
  }
  #modalTitle { font-size: 19px; font-weight: 700; letter-spacing: 2px; color: #e6eefb; margin-bottom: 8px; }
  #modalBody { font-size: 13px; line-height: 1.85; color: #a7bcd8; margin-bottom: 18px; }
  #modalBody .muted { color: #6f86a6; font-size: 12px; }
  #modalActions { display: flex; flex-wrap: wrap; gap: 10px; }
  .modal-btn {
    flex: 1 1 150px; padding: 11px 16px; border-radius: 9px; cursor: pointer;
    background: #172234; border: 1px solid #2c3d56; color: #cfdcf0;
    font-size: 13px; font-family: inherit; transition: all .12s;
  }
  .modal-btn:hover { background: #22334a; border-color: #4a7fb5; color: #fff; }
  .modal-btn.primary {
    background: linear-gradient(180deg, #3f7fb5, #2c5f8f); border-color: #6fa5d6;
    color: #f2f8ff; font-weight: 700; letter-spacing: 2px;
  }
  .modal-btn.t-fight { border-color: #7a3a3a; color: #ffb3b3; }
  .modal-btn.t-event { border-color: #5c4a8a; color: #cdb8ff; }
  .modal-btn.t-rest { border-color: #336b58; color: #a8e8cc; }
  .modal-btn.t-boss { border-color: #8a6a2a; color: #ffd98a; }
  .modal-btn.lucky {
    border-color: #d8b45a; color: #ffe7a3;
    background: linear-gradient(180deg, #49391d, #2c2417);
    box-shadow: 0 0 16px rgba(216, 180, 90, .35);
  }
  .lucky-tip { color: #ffd98a; margin-bottom: 8px; }

  #log {
    flex: 2 1 0; min-height: 0; padding: 8px 12px; overflow-y: auto;
    font-size: 12px; line-height: 1.65;
  }
  .log-item { padding: 3px 0; border-bottom: 1px dashed #141e2c; color: #93a6c2; }
  .log-item b { color: #dbe9ff; font-weight: 500; }
  .log-item.round { color: #5d7fae; text-align: center; letter-spacing: 2px; border: none; margin: 6px 0; }
  .log-item.dmg { color: #e8917f; }

const R_OUT = 5 / (2 * Math.sin(Math.PI / 5));
const SECTOR = Math.PI * 2 / 5;
const NEIGHBOR_DIST = 1.35;

const ATTR_NAME = ['金', '木', '水', '火', '土'];
const ATTR_HEX = ['#e8c05a', '#5fbf7a', '#4e8fe8', '#ee6a55', '#a9744f'];
const ATTR_FILL_HEX = ['#4e3c12', '#1b3d27', '#17345c', '#5a1e16', '#422a1c'];

/* ---------------- 棋盘几何 ---------------- */
function vertex(e, scale = 1) {
  const a = -Math.PI / 2 + e * SECTOR;
  return { x: Math.cos(a) * R_OUT * scale, z: Math.sin(a) * R_OUT * scale };
}

class Cell {
  constructor(id, region, ring, idx, x, z, attr) {
    this.id = id; this.region = region; this.ring = ring; this.idx = idx;
    this.x = x; this.z = z; this.attr = attr; this.baseAttr = attr; this.neighbors = [];
  }
  get label() {
    if (this.ring === 1) return '中心';
    return `${ATTR_NAME[REGION_ATTR[this.region]]}区·${this.ring}环·${this.idx + 1}`;
  }
}

function buildCells() {
  const list = [new Cell(0, -1, 1, 0, 0, 0, null)];
  for (let e = 0; e < 5; e++) {
    const a = vertex(e), b = vertex(e + 1);
    for (let s = 1; s <= 4; s++) {
      const f = s / 4;
      for (let k = 0; k < s; k++) {
        const t = (s - k) / s;
        const x = f * ((1 - t) * a.x + t * b.x);
        const z = f * ((1 - t) * a.z + t * b.z);
        list.push(new Cell(list.length, e, s + 1, k, x, z, REGION_ATTR[e]));
      }
    }
  }
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const d = Math.hypot(list[i].x - list[j].x, list[i].z - list[j].z);
      if (d <= NEIGHBOR_DIST) {
        list[i].neighbors.push(j);
        list[j].neighbors.push(i);
      }
    }
  }
  return list;
}

const cells = buildCells();

const cellDist = cells.map(start => {
  const d = new Array(cells.length).fill(Infinity);
  d[start.id] = 0;
  const q = [start.id];
  for (let h = 0; h < q.length; h++) {
    const id = q[h];
    for (const nb of cells[id].neighbors) {
      if (d[nb] === Infinity) { d[nb] = d[id] + 1; q.push(nb); }
    }
  }
  return d;
});
const stepDist = (a, b) => cellDist[a.id][b.id];
const geoDist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

function unitCells(u) {
  return u && Array.isArray(u.cells) && u.cells.length ? u.cells : (u && u.cell ? [u.cell] : []);
}

function unitGap(a, b) {
  const ac = unitCells(a);
  const bc = unitCells(b);
  let best = Infinity;
  for (const ca of ac) for (const cb of bc) {
    const d = stepDist(ca, cb);
    if (d < best) best = d;
  }
  return best;
}

function unitOccupiesCell(u, cell) {
  return !!u && u.alive && unitCells(u).some(c => c.id === cell.id);
}

function bossClosestCell(boss, fromCell) {
  let best = boss.cell;
  let bestD = Infinity;
  for (const c of unitCells(boss)) {
    const d = stepDist(fromCell, c);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function pentagonShape(radius) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 5; i++) {
    const v = vertex(i, radius / R_OUT);
    if (i === 0) shape.moveTo(v.x, -v.z);
    else shape.lineTo(v.x, -v.z);
  }
  shape.closePath();
  return shape;
}

function drawLabel(u, sprite) {
  const cv = sprite.userData.canvas;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = u.alive ? 'rgba(8,14,24,0.82)' : 'rgba(8,14,24,0.4)';
  const r = 16, w = cv.width - 8, h = 54, x = 4, y = 12;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = u.status.isNormal ? CAMP_HEX[u.camp] : STATUS_DEFS[u.status.key].color;
  ctx.globalAlpha = u.alive ? 0.9 : 0.3;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.font = '600 30px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = u.alive ? '#e8f0fb' : '#7c8a9d';
  ctx.textAlign = 'left';
  ctx.fillText(u.name, 22, 41);

  ctx.font = '600 26px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = u.alive ? ATTR_HEX[u.attr] : '#5c6778';
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.max(0, u.hp)}`, cv.width - 20, 41);
  sprite.userData.texture.needsUpdate = true;
}

function buildUnitMesh(u) {
  const group = new THREE.Group();
  const attrColor = ATTR_COLOR[u.attr];
  const campColor = new THREE.Color(CAMP_HEX[u.camp]);

  const gem = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.34, 0),
    new THREE.MeshStandardMaterial({
      color: attrColor, emissive: attrColor, emissiveIntensity: 0.55,
      roughness: 0.3, metalness: 0.45,
    })
  );
  gem.scale.set(1, 0.68, 1);
  gem.position.y = 0.34;
  group.add(gem);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(gem.geometry),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 })
  );
  edges.scale.copy(gem.scale);
  edges.position.copy(gem.position);
  group.add(edges);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.4, 0.5, 40),
    new THREE.MeshBasicMaterial({
      color: campColor, transparent: true, opacity: 0.7, side: THREE.DoubleSide,
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.022;
  group.add(ring);

  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 80;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
  }));
  sprite.scale.set(1.42, 0.44, 1);
  sprite.position.y = 0.96;
  sprite.userData = { canvas: cv, texture: tex };
  group.add(sprite);
  drawLabel(u, sprite);

  gem.userData.unitId = u.id;
  gem.userData.partCellId = u.cell.id;
  group.userData.gem = gem;
  if (u.isBoss && Array.isArray(u.cells)) {
    group.userData.gems = [gem];
    for (const pc of u.cells) {
      if (pc.id === u.cell.id) continue;
      const partGem = gem.clone();
      partGem.position.set(pc.x - u.cell.x, 0.34, pc.z - u.cell.z);
      partGem.userData = { unitId: u.id, partCellId: pc.id };
      group.add(partGem);
      group.userData.gems.push(partGem);
      const partRing = new THREE.Mesh(
        new THREE.RingGeometry(0.4, 0.5, 40),
        new THREE.MeshBasicMaterial({
          color: campColor, transparent: true, opacity: 0.55, side: THREE.DoubleSide,
        })
      );
      partRing.rotation.x = -Math.PI / 2;
      partRing.position.set(pc.x - u.cell.x, 0.022, pc.z - u.cell.z);
      group.add(partRing);
    }
  }
  return group;
}

let enterSeqCounter = 0;
const STACK_SCALES = [1, 0.8, 0.6, 0.4];

function moveUnit(u, cell) {
  u.cell = cell;
  u.enterSeq = ++enterSeqCounter;
  layoutUnits();
}

function layoutUnits() {
  const groups = new Map();
  units.forEach(u => {
    if (!u.alive) return;
    const key = u.cell.id;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(u);
  });
  for (const [key, arr] of groups) {
    const c = cells[key];
    arr.sort((a, b) => a.enterSeq - b.enterSeq);
    arr.forEach((u, i) => {
      u.target = new THREE.Vector3(c.x, i * 0.62, c.z);
      u.stackScale = STACK_SCALES[Math.min(i, STACK_SCALES.length - 1)];
      if (u.mesh) u.mesh.scale.setScalar(u.stackScale);
      if (u.instant) {
        u.mesh.position.copy(u.target);
        u.instant = false;
      }
    });
  }
}

const aliveUnits = () => units.filter(u => u.alive);
const currentActor = () => units.find(u => u.id === state.currentUnitId) || null;

function skillCost(u, s) {
  if (s.costAllMana) return { mana: u.mana, allMana: true };
  const manaBase = s.cost.mana || 0;
  let mana = manaBase;
  if (s.dynamicCost === 'plus') mana = manaBase + (u.skillCostUses[s.id] || 0);
  else if (s.dynamicCost === 'double') mana = manaBase * Math.pow(2, u.skillCostUses[s.id] || 0);
  return { mana, sta: s.cost.sta || 0 };
}

function skillCostText(u, s) {
  if (s.costAllMana) return '全部魔力';
  return costText(skillCost(u, s));
}

function affordable(u, s) {
  const c = skillCost(u, s);
  return (c.mana || 0) <= u.mana && (c.sta || 0) <= u.sta;
}

function paySkillCost(u, s) {
  const c = skillCost(u, s);
  payCost(u, c);
  if (s.dynamicCost) u.skillCostUses[s.id] = (u.skillCostUses[s.id] || 0) + 1;
  if (s.onceBattle) u.skillOnceUsed[s.id] = true;
  return c;
}

function validTargets(actor, s) {
  if (s.target === 'enemy') {
    const list = units.filter(u => u.alive && u.camp !== actor.camp);
    if (s.type === 'attack') {
      const inRange = list.filter(u => unitGap(actor, u) <= actor.atkRange);
      const taunts = inRange.filter(u => u.taunt);
      return taunts.length ? taunts : inRange;
    }
    return list;
  }
  if (s.target === 'ally') {
    return units.filter(u => u.alive && u.camp === actor.camp && (s.includeSelf || u.id !== actor.id));
  }
  return [];
}

function validCells(actor, s) {
  if (s.target !== 'cell') return [];
  if (s.type === 'dodge' || s.type === 'move') {
    const r = s.params.move;
    return cells.filter(c => {
      const d = stepDist(actor.cell, c);
      return d >= 1 && d <= r;
    });
  }
  return cells.slice();
}

function decisionText(u) {
  if (!u.alive) return '已倒下';
  if (u.skipped) return '无力，本回合无法行动';
  const d = state.decisions[u.id];
  if (!d) return state.phase === 'decision' ? '等待决策…' : '未决策';
  const act = d.action ? ENEMY_ACTIONS[d.action] : null;
  const s = d.skillId !== undefined ? SKILL_MAP[d.skillId] : null;
  let t = act ? act.name : (s ? s.name : '—');
  if (Array.isArray(d.targetUnitIds)) t += ` → ${d.targetUnitIds.map(id => units[id] ? units[id].name : id).join('、')}`;
  if (d.targetUnitId !== undefined) t += ` → ${units[d.targetUnitId].name}`;
  if (d.targetPartCellId !== undefined) t += `（${cells[d.targetPartCellId].label}）`;
  if (d.targetCellId !== undefined) t += ` → ${cells[d.targetCellId].label}`;
  return t;
}

function costText(cost) {
  const parts = [];
  if (cost.mana) parts.push(`${cost.mana} 魔`);
  if (cost.sta) parts.push(`${cost.sta} 体`);
  return parts.join(' + ') || '—';
}

        <span class="tag camp">${CAMP_NAME[u.camp]}</span>
        ${u.isBoss ? `<span class="tag">部位 ${u.bossParts.filter(p => p.hit).length}/${u.bossParts.length}</span>` : ''}
        ${u.status.isNormal ? '' : `<span class="tag status">${u.status.name}</span>`}
      </div>
      <div class="hpbar"><i style="width:${pct}%"></i><b>${Math.max(0, u.hp)} / ${u.maxHp}</b></div>
      <div class="stats"><span>攻 ${u.atk}</span><span>防 ${u.def}</span><span>体 ${u.sta}/${u.maxSta}</span><span>魔 ${u.mana}/${u.maxMana}</span><span>距 ${u.atkRange}</span></div>
      <div class="dec">行动：<b>${decisionText(u)}</b></div>
      ${unitIntro(u) ? `<div class="intro">${unitIntro(u)}</div>` : ''}`;
    unitBar.appendChild(card);
  }
  if (dossierUnitId !== null) renderDossier();
}

function phaseText() {
  if (state.phase === 'deploy') return '布阵阶段';
  if (state.over) {
    if (state.winner === 'draw') return '平局';
    return state.winner === 0 ? '我方胜利' : '我方战败';
  }
  return state.phase === 'decision' ? '决策阶段' : '结算阶段';
}

function updateTop() {
  if (!run.active) {
    phaseInfo.textContent = '等待开始';
  } else if (run.phase !== 'battle') {
    phaseInfo.textContent = `肉鸽 · 第 ${run.stageIndex + 1} / ${RUN_LAYERS} 层`;
  } else {
    phaseInfo.textContent = `第 ${state.round} / ${MAX_ROUNDS} 回合 · ${phaseText()}`;
  }
  runInfo.textContent = run.rogue ? `难度 ${run.rogue.difficulty} · 幸运 ${run.rogue.luck}` : '';
  const order = units.filter(u => u.alive).sort((a, b) => a.id - b.id);
  orderList.innerHTML = order.map(u => {
    let c = 'order-chip';
    if (u.id === state.currentUnitId) c += ' now';
    if (u.skipped) c += ' skip';
    return `<span class="${c}" data-camp="${u.camp}">${u.name}</span>`;
  }).join('');
}

function renderSkillPanel() {
  const actor = currentActor();
  spBody.innerHTML = '';

  if (serverDown) {
    spUnit.textContent = '服务已关闭';
    spNote.textContent = '';
    spBody.innerHTML = '<div class="sp-empty">本地服务已关闭，可以关闭本页。<br>下次请重新双击「启动游戏.bat」。</div>';
    return;
  }
  if (state.over) {
    spUnit.textContent = '对局结束';
    spNote.textContent = '';
    spBody.innerHTML = `<div class="sp-empty">${phaseText()}，共 ${state.round} 回合。</div>`;
    return;
  }
  if (state.phase === 'resolve') {
    spUnit.textContent = '结算中';
    spNote.textContent = actor ? actor.name : '';
    spBody.innerHTML = '<div class="sp-empty">正在按行动顺序结算，请稍候…</div>';
    return;
  }
  if (state.phase === 'deploy' && deployment) {
    renderDeployPanel();
    return;
  }
  if (!actor) {
    spUnit.textContent = '准备中';
    spNote.textContent = '';
    return;
  }

  spUnit.textContent = `${actor.name} · 选择行动`;
  spNote.textContent = actor.skipped ? '本回合无力' : '';

  if (actor.camp !== 0) {
    spBody.innerHTML = `<div class="sp-empty">${actor.name} 正在行动…</div>`;
    return;
  }
  if (actor.skipped) {
    spBody.innerHTML = '<div class="sp-empty">处于「无力」状态，本回合无法决策。</div>';
    return;
  }

  const groups = new Map();
  for (const id of actor.skills) {
    const s = SKILL_MAP[id];
    if (!s) continue;
    if (!groups.has(s.type)) groups.set(s.type, []);
    groups.get(s.type).push(s);
  }

  for (const type of SKILL_TYPE_ORDER) {
    if (!groups.has(type)) continue;
    const list = groups.get(type);
    const wrap = document.createElement('div');
    wrap.className = 'sp-group';
    wrap.innerHTML = `<div class="sp-cat">${SKILL_TYPES[type].name}</div>`;
    const grid = document.createElement('div');
    grid.className = 'sp-list';
    for (const s of list) {
      const btn = document.createElement('button');
      btn.className = 'skill' + (draft && draft.skill.id === s.id ? ' active' : '');
      btn.dataset.id = s.id;
      let ok = affordable(actor, s);
      if (ok && s.onceBattle && actor.skillOnceUsed[s.id]) ok = false;
      if (ok && s.target === 'enemy') ok = validTargets(actor, s).length > 0;
      if (ok && s.target === 'ally') ok = validTargets(actor, s).length > 0;
      if (ok && (s.type === 'dodge' || s.type === 'move')) ok = validCells(actor, s).length > 0;
      btn.disabled = !ok;
      const costLabel = s.onceBattle && actor.skillOnceUsed[s.id] ? '本场已用' : skillCostText(actor, s);
      btn.innerHTML = `<span>${s.name}</span><small>${costLabel}</small>`;
      grid.appendChild(btn);
    }
      wrap.appendChild(grid);
      spBody.appendChild(wrap);
  }

  const onceList = run.artifacts.filter(a => ARTIFACTS[a.id].kind === 'once' && a.count > 0);
  if (onceList.length) {
    const wrap = document.createElement('div');
    wrap.className = 'sp-group';
    wrap.innerHTML = '<div class="sp-cat">单次藏品</div>';
    const grid = document.createElement('div');
    grid.className = 'sp-list';
    for (const inst of onceList) {
      const a = ARTIFACTS[inst.id];
      const btn = document.createElement('button');
      btn.className = 'skill';
      btn.dataset.relic = inst.id;
      btn.disabled = !(actor.camp === 0 && !state.onceUsed);
      btn.innerHTML = `<span>${a.name}</span><small>×${inst.count}</small>`;
      grid.appendChild(btn);
    }
    wrap.appendChild(grid);
    spBody.appendChild(wrap);
  }
}

function renderDeployPanel() {
  const cur = deployUnit();
  spUnit.textContent = '布阵 · 选择站位';
  spNote.textContent = deployReady() ? '全员已就位' : `${deployment.index + 1} / ${deployment.order.length}`;
  spBody.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'deploy-list';
  deployment.order.forEach((u, i) => {
    const status = i < deployment.index ? '已就位' : (u === cur ? '选位中' : '待选');
    const row = document.createElement('button');
    row.className = 'deploy-row' + (u === cur ? ' current' : '');
    row.style.setProperty('--attr', ATTR_HEX[u.attr]);
    row.innerHTML = `<span class="dn">${u.name}</span>
      <span class="da">${ATTR_NAME[u.attr]}</span>
      <span class="dc">${u.cell.label} · ${status}</span>`;
    row.onclick = () => selectDeployUnit(u);
    list.appendChild(row);
  });
  spBody.appendChild(list);
  const tip = document.createElement('div');
  tip.className = 'sp-empty deploy-tip';
  tip.innerHTML = cur
    ? `点击棋盘上的高亮格，放置 <b>${cur.name}</b>。点击列表中的队友可重新选位。`
    : '全员已就位，点击下方「开始战斗」。';
  spBody.appendChild(tip);
  const actions = document.createElement('div');
  actions.className = 'deploy-actions';
  const back = document.createElement('button');
  back.textContent = '上一步';
  back.disabled = deployment.index <= 0;
  back.onclick = () => {
    deployment.index = Math.max(0, deployment.index - 1);
    updateAll();
  };
  const reset = document.createElement('button');
  reset.textContent = '默认站位';
  reset.onclick = () => resetDeployment();
  actions.append(back, reset);
  spBody.appendChild(actions);
}

function updateHint() {
  if (serverDown) {
    hintEl.textContent = '本地服务已关闭，可以关闭本页';
    return;
  }
  if (state.over) {
    hintEl.textContent = '对局结束，点「重新开始」再来一局';
    return;
  }
  if (state.phase === 'resolve') {
    const a = currentActor();
    hintEl.textContent = `结算中：${a ? a.name : ''}`;
    return;
  }
  if (state.phase === 'deploy' && deployment) {
    const u = deployUnit();
    hintEl.textContent = u
      ? `布阵：点击高亮格，确定 ${u.name} 的起始位置`
      : '全员已就位，点击「开始战斗」';
    return;
  }
  if (pendingRelic) {
    const a = ARTIFACTS[pendingRelic.id];
    hintEl.textContent = a.target === 'ally'
      ? `请点击一名队友使用【${a.name}】`
      : `请点击一名敌人使用【${a.name}】`;
    return;
  }
  if (draft) {
    const s = draft.skill;
    if (draftReady()) {
      hintEl.textContent = '确认无误后，点击右侧「确定决策」';
      return;
    }
    hintEl.textContent =
      s.type === 'attack' ? `请点击攻击距离（${draft.unit.atkRange} 格）内的敌方角色` :
      s.type === 'dodge' ? `请点击 ${s.params.move} 格内的格子作为闪避落点` :
      s.type === 'move' ? `请点击 ${s.params.move} 格内的相邻格子移动` :
      s.target === 'ally' ? (s.includeSelf ? '请点击一名队友或自己' : '请点击一名队友') :
      '请点击一个格子作为法术目标';
    return;
  }
  const a = currentActor();
  if (a && a.skipped) hintEl.textContent = `${a.name} 处于无力状态，本回合跳过`;
  else if (a && a.camp === 0) hintEl.textContent = `轮到 ${a.name} 决策：请在右侧选择技能`;
  else hintEl.textContent = a ? `${a.name} 行动中…` : '';
}

function updateHighlights() {
  const lit = new Set();
  const hot = new Set();
  if (state.phase === 'deploy' && deployment) {
    const cur = deployUnit();
    if (cur) {
      deployableCells(cur).forEach(c => lit.add(c.id));
      hot.add(cur.id);
    }
  }
  if (draft) {
    const s = draft.skill;
    if (s.type === 'dodge' || s.type === 'move') validCells(draft.unit, s).forEach(c => lit.add(c.id));
    else if (s.target === 'cell') cells.forEach(c => lit.add(c.id));
    if (s.target === 'enemy' || s.target === 'ally') {
      validTargets(draft.unit, s).forEach(u => hot.add(u.id));
    }
  }
  if (pendingRelic) {
    const a = ARTIFACTS[pendingRelic.id];
    units.forEach(u => {
      if (!u.alive) return;
      if (a.target === 'ally' && u.camp === 0) hot.add(u.id);
      if (a.target === 'enemy' && u.camp === 1) hot.add(u.id);
    });
  }
  cells.forEach(c => {
    const on = lit.has(c.id);
    const k = on ? 1.12 : 1;
    cellMats[c.id].emissiveIntensity = on ? 1.7 : 0.4;
    cellMeshes[c.id].scale.setScalar(k);
    cellBorders[c.id].scale.setScalar(k);
    cellLabels[c.id].scale.setScalar(k);
  });
  units.forEach(u => {
    if (!u.mesh) return;
    u.mesh.visible = u.alive;
    u.mesh.scale.setScalar((u.stackScale || 1) * (hot.has(u.id) ? 1.16 : 1));
    const sprite = u.mesh.children[3];
    if (sprite) drawLabel(u, sprite);
  });
}

function refreshCard() {
  const actor = currentActor();
  let s = null;
  let who = null;
  if (draft) { s = draft.skill; who = draft.unit; }
  else if (hoverSkillId !== null) { s = SKILL_MAP[hoverSkillId]; who = actor; }
  else if (lastSkill) { s = SKILL_MAP[lastSkill.skillId]; who = units[lastSkill.unitId]; }

  if (!s || state.over || state.phase !== 'decision' || !actor || actor.camp !== 0) {
    cardEl.classList.add('hidden');
    return;
  }
  scCat.textContent = SKILL_TYPES[s.type].name;
  scCat.style.color = SKILL_TYPES[s.type].color;
  scName.textContent = `${who ? who.name + ' · ' : ''}${s.name}`;
  const c = who ? skillCostText(who, s) : costText(s.cost);
  scCost.textContent = c === '—' ? '消耗：无' : `消耗：${c}`;
  scDesc.textContent = s.desc || '';
  cardEl.classList.remove('hidden');
}

function updateAll() {
  updateTop();
  renderUnitBar();
  renderSkillPanel();
  updateFoot();
  refreshCard();
  updateHint();
  updateHighlights();
}

/* ---------------- 规则 ---------------- */
function counterBonus() {
  return 1 + Math.floor((run.stageIndex || 0) / 3);
}

function modifierParts(att, tgt, attCell = att.cell, tgtCell = tgt.cell) {
  let m = 0;
  const parts = [];
  const c = counterBonus();
  if (BEATS[att.attr] === tgt.attr) { m += c; parts.push(`属性克制 +${c}`); }
  else if (BEATS[tgt.attr] === att.attr) { m -= c; parts.push(`属性被克 -${c}`); }
  if (attCell.attr !== null && tgtCell.attr !== null) {
    if (BEATS[attCell.attr] === tgtCell.attr) { m += c; parts.push(`格属性克制 +${c}`); }
    else if (BEATS[tgtCell.attr] === attCell.attr) { m -= c; parts.push(`格属性被克 -${c}`); }
  }
  return { m, parts };
}

function payCost(u, cost) {
  if (cost.mana) u.mana = Math.max(0, u.mana - cost.mana);
  if (cost.sta) u.sta = Math.max(0, u.sta - cost.sta);
}

function applyDamage(u, dmg, source = null) {
  if (dmg <= 0 || !u.alive) return 0;
  if (u.damageImmune) {
    log(`${name(u)} 免疫了 ${dmg} 点伤害`, 'note');
    return 0;
  }
  if (source && source.camp === 0) lastPlayerDamagerId = source.id;
  u.hp -= dmg;
  u.damageThisRound += dmg;
  if (u.hp <= 0) {
    u.alive = false;
    log(`${name(u)} 倒下了`, 'dmg');
  }
  return dmg;
}

function setCellAttr(cell, attr) {
  if (cell.attr === attr) return false;
  cell.attr = attr;
  refreshCellColors();
  return true;
}

function knockback(u, from) {
  if (u.isBoss) return;
  const cur = geoDist(u.cell, from.cell);
  let maxD = -1;
  for (const id of u.cell.neighbors) maxD = Math.max(maxD, geoDist(cells[id], from.cell));
  if (maxD <= cur + 1e-6) {
    log(`${name(u)} 已无法继续后退，原地不动`, 'note');
    return;
  }
  const pool = u.cell.neighbors
    .map(id => cells[id])
    .filter(c => Math.abs(geoDist(c, from.cell) - maxD) < 1e-6)
    .sort((a, b) => b.ring - a.ring);
  u.cell = pool[0];
  u.enterSeq = ++enterSeqCounter;
  layoutUnits();
  log(`${name(u)} 被击退到 ${pool[0].label}`, 'move');
}

function tryDodge(t, tSkill) {
  const cost = tSkill.params.reactionCost || 0;
  if (cost > 0 && t.sta < cost) {
    log(`${name(t)} 体力不足，无法闪避本次攻击`, 'note');
    return false;
  }
  t.sta = Math.max(0, t.sta - cost);
  log(`${name(t)} 闪避成功${cost ? `，体力 -${cost}` : '（不耗体力）'}`, 'evade');
  return true;
}

function isTaunting(u) {
  if (!u || !u.alive) return false;
  if (u.taunt) return true;
  const d = state.decisions[u.id];
  if (!d) return false;
  if (d.action === 'taunt') return true;
  const s = d.skillId !== undefined ? SKILL_MAP[d.skillId] : null;
  return !!(s && s.params && s.params.taunt);
}

function tauntInRange(u) {
  return units.filter(x => x.alive && x.camp !== u.camp && isTaunting(x) && unitGap(u, x) <= u.atkRange);
}

function forcedTauntTarget(u, target) {
  const list = tauntInRange(u);
  if (!list.length) return target;
  if (target && list.includes(target)) return target;
  return list.slice().sort((a, b) => (b.def - a.def) || (a.hp - b.hp))[0];
}

function triggerTauntArmor(t) {
  if (t.tauntUsed) return false;
  t.tauntUsed = true;
  t.def += 1;
  log(`${name(t)} 嘲讽：护甲 +1（${t.def}）`, '');
  return true;
}

function resolveAttackTarget(u, dec, label, cost) {
  payCost(u, cost);
  let t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${label}失去目标`, 'note'); return null; }
  if (unitGap(u, t) > u.atkRange) {
    log(`${name(u)} 的${label}超出攻击距离（${u.atkRange} 格），落空`, 'note');
    return null;
  }
  const forced = forcedTauntTarget(u, t);
  if (forced !== t) {
    log(`${name(u)} 被 ${name(forced)} 嘲讽，目标改为它`, 'note');
    t = forced;
  }
  return t;
}

function attackCellPair(attacker, target, targetPartCellId) {
  const attCell = attacker.isBoss ? bossClosestCell(attacker, target.cell) : attacker.cell;
  let tgtCell = target.isBoss ? bossClosestCell(target, attacker.cell) : target.cell;
  if (target.isBoss && Number.isInteger(targetPartCellId)) {
    const part = target.cells.find(c => c.id === targetPartCellId);
    if (part) tgtCell = part;
  }
  return { attCell, tgtCell };
}

function resolveAttackDamage(u, t, opts) {
  const { attCell, tgtCell } = attackCellPair(u, t, opts.targetPartCellId);
  const hitCell = tgtCell;
  const { m, parts } = modifierParts(u, t, attCell, tgtCell);
  const raw = Math.max(0, opts.power + m);
  log(`${name(u)} 对 ${name(t)} 使用${opts.label}${parts.length ? `（${parts.join('，')}）` : ''}`, '');

  const td = state.decisions[t.id];
  const tSkill = td && td.skillId !== undefined ? SKILL_MAP[td.skillId] : null;
  const taunt = !!(td && td.action === 'taunt') || !!(tSkill && tSkill.params && tSkill.params.taunt);
  const counter = !!(td && td.action === 'counter');
  if (taunt) triggerTauntArmor(t);
  if (tSkill && tSkill.id === 23 && u.camp !== t.camp) triggerArmorUp(t);

  if (!opts.skipDodge && tSkill && tSkill.type === 'dodge' && tryDodge(t, tSkill)) {
    return false;
  }
  if (t.isBoss && u.camp !== t.camp) markBossPartHit(t, tgtCell, u);

  if (taunt || counter || (tSkill && tSkill.type === 'defend')) {
    const dmg = Math.max(0, raw - (opts.ignoreDef ? 0 : t.def));
    const dealt = applyDamage(t, dmg, u);
    t.def = Math.max(0, t.def - 1);
    log(`${name(t)} 防御，受到 ${dealt} 点伤害，防御力降为 ${t.def}`, 'dmg');
    if (t.alive && !t.isBoss) knockback(t, u);
    if (tSkill && tSkill.params && tSkill.params.retaliate && u.alive) {
      applyDamage(u, tSkill.params.retaliate, t);
      log(`${name(t)} 反击，对 ${name(u)} 造成 ${tSkill.params.retaliate} 点伤害`, 'dmg');
    }
    if (tSkill && tSkill.params && tSkill.params.restoreDef && t.alive) {
      const manaCost = tSkill.cost.mana || 0;
      if (t.mana >= manaCost) {
        t.mana -= manaCost;
        t.def = Math.min(t.maxDef, t.def + tSkill.params.restoreDef);
        log(`${name(t)} 消耗 ${manaCost} 魔力，防御力恢复为 ${t.def}`, '');
      }
    }
    if (counter) {
      if (u.alive) {
        applyDamage(u, 1, t);
        log(`${name(t)} 反击，对 ${name(u)} 造成 1 点伤害`, 'dmg');
      }
      t.mana = Math.min(t.maxMana, t.mana + 1);
      log(`${name(t)} 反击回复 1 点魔力（${t.mana}/${t.maxMana}）`, 'spell');
    }
  } else {
    const dealt = applyDamage(t, raw, u);
    log(`${name(t)} 无有效防御，受到 ${dealt} 点伤害`, 'dmg');
  }

  if (opts.convertCell === 'target') {
    if (setCellAttr(hitCell, u.attr)) log(`${hitCell.label} 属性变为 ${ATTR_NAME[u.attr]}`, 'spell');
  }
  if (opts.convertAround === 'target') {
    let n = 0;
    hitCell.neighbors.forEach(id => { if (setCellAttr(cells[id], u.attr)) n++; });
    log(`${hitCell.label} 周围 ${n} 个格子属性变为 ${ATTR_NAME[u.attr]}`, 'spell');
  }
  opts.onHit?.(t);
  return true;
}

function markBossPartHit(boss, cell, source = null) {
  if (!boss.bossParts) return false;
  const part = boss.bossParts.find(p => p.cell.id === cell.id);
  if (!part || part.hit) return false;
  part.hit = true;
  part.pending = true;
  part.sourceId = source ? source.id : undefined;
  log(`BOSS 的${cell.label}部位首次受击`, 'note');
  return true;
}

function bossEndRound(boss) {
  if (!boss.alive) return;
  let total = 0;
  for (const part of boss.bossParts) {
    if (!part.pending) continue;
    part.pending = false;
    const loss = Math.ceil(boss.maxHp / 8);
    total += loss;
    log(`BOSS 的${part.cell.label}部位破坏：失去 ${loss} 点血量`, 'dmg');
    applyDamage(boss, loss, part.sourceId !== undefined ? units[part.sourceId] : null);
    if (!boss.alive) break;
  }
  if (total) log(`BOSS 部位结算：共失去 ${total} 点血量`, 'dmg');
  if (!boss.alive) return;
  if (!boss.enraged && boss.hp * 2 < boss.maxHp) {
    boss.enraged = true;
    boss.baseAtk = Math.ceil(boss.baseAtk * 1.5);
    boss.atk = boss.baseAtk + boss.permAtk;
    log(`BOSS 狂暴：攻击力提升 50%，当前攻击力 ${boss.atk}`, 'round');
  }
}

function runAttack(u, dec, s) {
  const t = resolveAttackTarget(u, dec, s.name, s.cost);
  if (!t) return;
  const power = s.params.power === 'atk' ? u.atk : s.params.power;
  resolveAttackDamage(u, t, {
    label: s.name,
    power,
    convertCell: s.params.convertCell,
    convertAround: s.params.convertAround,
    targetPartCellId: dec.targetPartCellId,
  });
}

function runCorrode(u, dec) {
  const t = resolveAttackTarget(u, dec, '腐蚀', { mana: 2 });
  if (!t) return;
  const td = state.decisions[t.id];
  const tSkill = td && td.skillId !== undefined ? SKILL_MAP[td.skillId] : null;
  if (td && td.action === 'taunt') triggerTauntArmor(t);
  if (tSkill && tSkill.type === 'dodge' && tryDodge(t, tSkill)) return;
  if (tSkill && tSkill.id === 23) triggerArmorUp(t);
  if (t.def > 0) {
    t.def -= 1;
    log(`${name(u)} 对 ${name(t)} 使用腐蚀，护甲 -1（剩余 ${t.def}），本击无伤害`, 'dmg');
    return;
  }
  const { m, parts } = modifierParts(u, t);
  const raw = Math.max(0, u.atk + m);
  const dealt = applyDamage(t, raw, u);
  t.sta = Math.max(0, t.sta - 1);
  log(`${name(u)} 对 ${name(t)} 使用腐蚀${parts.length ? `（${parts.join('，')}）` : ''}，造成 ${dealt} 点伤害，体力 -1（剩余 ${t.sta}）`, 'dmg');
}

function runTransform(u, dec) {
  const t = resolveAttackTarget(u, dec, '变换', { mana: 2 });
  if (!t) return;
  const td = state.decisions[t.id];
  const tSkill = td && td.skillId !== undefined ? SKILL_MAP[td.skillId] : null;
  if (td && td.action === 'taunt') triggerTauntArmor(t);
  if (tSkill && tSkill.type === 'dodge' && tryDodge(t, tSkill)) return;
  if (tSkill && tSkill.id === 23) triggerArmorUp(t);
  const tgtCell = t.isBoss ? bossClosestCell(t, u.cell) : t.cell;
  const selfBefore = u.cell.attr;
  const tgtBefore = tgtCell.attr;
  setCellAttr(u.cell, u.attr);
  setCellAttr(tgtCell, t.attr);
  log(`${name(u)} 施放变换：己方格 ${ATTR_NAME[selfBefore] ?? '无'} → ${ATTR_NAME[u.attr]}，${name(t)} 所在格 ${ATTR_NAME[tgtBefore] ?? '无'} → ${ATTR_NAME[t.attr]}`, 'spell');
  resolveAttackDamage(u, t, {
    label: '变换',
    power: u.atk,
    skipDodge: true,
    targetPartCellId: t.isBoss ? tgtCell.id : undefined,
  });
}

function runDodge(u, dec, s) {
  payCost(u, s.cost);
  const c = cells[dec.targetCellId];
  if (!c || stepDist(u.cell, c) > s.params.move) {
    log(`${name(u)} 的${s.name}落点无效`, 'note');
    return;
  }
  moveUnit(u, c);
  log(`${name(u)} 使用${s.name}移动到 ${c.label}`, 'move');
}

function runMove(u, dec, s) {
  payCost(u, s.cost);
  const c = cells[dec.targetCellId];
  if (!c || stepDist(u.cell, c) > s.params.move) {
    log(`${name(u)} 的${s.name}落点无效`, 'note');
    return;
  }
  moveUnit(u, c);
  log(`${name(u)} 移动到 ${c.label}`, 'move');
}

function runConvertCell(u, dec, s) {
  payCost(u, s.cost);
  const c = cells[dec.targetCellId];
  if (!c) return;
  setCellAttr(c, u.attr);
  log(`${name(u)} 施法，${c.label} 属性变为 ${ATTR_NAME[u.attr]}`, 'spell');
}

function runRecoverMana(u, dec, s) {
  const before = u.mana;
  u.mana = Math.min(u.maxMana, u.mana + s.params.mana);
  log(`${name(u)} 回元，魔力 ${before} → ${u.mana}`, '');
}

function runRecoverManaAlly(u, dec, s) {
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${s.name}失去目标`, 'note'); return; }
  const a = u.mana, b = t.mana;
  u.mana = Math.min(u.maxMana, u.mana + s.params.mana);
  t.mana = Math.min(t.maxMana, t.mana + s.params.mana);
  log(`${name(u)} 与 ${name(t)} 各回复 ${s.params.mana} 点魔力（${a}→${u.mana} / ${b}→${t.mana}）`, 'spell');
}

function runRest(u, dec, s) {
  const before = u.sta;
  u.sta = Math.min(u.maxSta, u.sta + (s.params.sta || 0));
  let extra = 0;
  if (s.params.bonusIfNoDamage && u.damageThisRound === 0) {
    extra = s.params.bonusIfNoDamage;
    u.sta = Math.min(u.maxSta, u.sta + extra);
  }
  log(`${name(u)} ${s.name}，体力 ${before} → ${u.sta}${extra ? '（未受伤，额外 +1）' : ''}`, '');
}

function runBuffAtk(u, dec, s) {
  payCost(u, s.cost);
  u.atk += s.params.atk;
  log(`${name(u)} 施法，攻击力提升至 ${u.atk}`, 'spell');
}

function runApplyStatus(u, dec, s) {
  payCost(u, s.cost);
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${s.name}失去目标`, 'note'); return; }
  t.status.apply(s.params.status, s.params.turns, t);
  log(`${name(t)} 进入「${t.status.name}」状态（${s.params.turns} 回合）`, 'spell');
}

function runHealStamina(u, dec, s) {
  paySkillCost(u, s);
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${s.name}失去目标`, 'note'); return; }
  const before = t.sta;
  t.sta = Math.min(t.maxSta, t.sta + (s.params.sta || 1));
  log(`${name(u)} 对 ${name(t)} 使用${s.name}，体力 ${before} → ${t.sta}`, 'spell');
}

function runAttributeAttack(u, dec, s) {
  const t = resolveAttackTarget(u, dec, s.name, s.cost);
  if (!t) return;
  const { attCell, tgtCell } = attackCellPair(u, t, dec.targetPartCellId);
  const attrAdv = BEATS[u.attr] === t.attr;
  const cellAdv = attCell.attr !== null && tgtCell.attr !== null && BEATS[attCell.attr] === tgtCell.attr;
  if (!attrAdv && !cellAdv) {
    log(`${name(u)} 对 ${name(t)} 使用${s.name}，属性与格子均未克制，未造成伤害`, 'note');
    return;
  }
  const reasons = [];
  if (attrAdv) reasons.push('属性克制');
  if (cellAdv) reasons.push('格子克制');
  log(`${name(u)} 的${s.name}满足${reasons.join(' + ')}`, 'spell');
  resolveAttackDamage(u, t, {
    label: s.name,
    power: u.atk * (s.params?.power || 3),
    targetPartCellId: dec.targetPartCellId,
  });
}

function runAlchemy(u, dec, s) {
  paySkillCost(u, s);
  u.atk += 1;
  log(`${name(u)} 使用${s.name}，本场攻击力 +1（当前 ${u.atk}）`, 'spell');
}

function runNourish(u, dec, s) {
  paySkillCost(u, s);
  u.hp = u.maxHp;
  u.sta = u.maxSta;
  if (u.battleSnapshot) u.def = u.battleSnapshot.def;
  log(`${name(u)} 使用${s.name}，血量与体力回满，防御恢复为 ${u.def}`, 'spell');
}

function runSurge(u, dec, s) {
  paySkillCost(u, s);
  const t = resolveAttackTarget(u, dec, s.name, {});
  if (!t) return;
  const amount = t.mana;
  t.mana = 0;
  applyDamage(t, amount, u);
  log(`${name(u)} 对 ${name(t)} 使用${s.name}，消耗其全部 ${amount} 点魔力并造成等量伤害`, 'spell');
}

function runBlaze(u, dec, s) {
  paySkillCost(u, s);
  const t = resolveAttackTarget(u, dec, s.name, {});
  if (!t) return;
  resolveAttackDamage(u, t, {
    label: s.name,
    power: u.atk * 3,
    targetPartCellId: dec.targetPartCellId,
  });
}

function triggerArmorUp(t) {
  if (t.skillOnceUsed[23]) return false;
  t.skillOnceUsed[23] = true;
  t.damageImmune = true;
  t.atk += 2;
  log(`${name(t)} 触发【起甲】：本回合免疫所有伤害，攻击力 +2（当前 ${t.atk}）`, 'spell');
  return true;
}

function runCastArmor(u, dec, s) {
  paySkillCost(u, s);
  for (const p of playerUnits) {
    if (!p.alive) continue;
    p.def += 1;
    p.maxDef += 1;
  }
  log(`${name(u)} 使用${s.name}：全队本场防御力 +1`, 'spell');
}

function runVitality(u, dec, s) {
  const t = resolveAttackTarget(u, dec, s.name, s.cost);
  if (!t) return;
  const amount = Math.floor(u.atk / 2);
  const hit = resolveAttackDamage(u, t, {
    label: s.name,
    power: amount,
    targetPartCellId: dec.targetPartCellId,
  });
  if (!hit) return;
  const hero = playerUnits[0];
  if (hero && hero.alive) {
    const before = hero.hp;
    hero.hp = Math.min(hero.maxHp, hero.hp + amount);
    log(`${name(hero)} 因${s.name}回复 ${hero.hp - before} 点生命`, 'spell');
  }
}

function runNature(u, dec, s) {
  paySkillCost(u, s);
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${s.name}失去目标`, 'note'); return; }
  const changed = setCellAttr(t.cell, t.attr);
  const amount = Math.floor(u.atk / 2);
  const before = t.hp;
  t.hp = Math.min(t.maxHp, t.hp + amount);
  log(`${name(u)} 对 ${name(t)} 使用${s.name}，${changed ? `${t.cell.label} 属性变为 ${ATTR_NAME[t.attr]}，` : ''}回复 ${t.hp - before} 点生命`, 'spell');
}

function runLightCultivate(u, dec, s) {
  const t = resolveAttackTarget(u, dec, s.name, s.cost);
  if (!t) return;
  const hit = resolveAttackDamage(u, t, {
    label: s.name,
    power: u.atk,
    targetPartCellId: dec.targetPartCellId,
  });
  if (!hit) return;
  const amount = Math.floor(u.atk / 2);
  const before = t.mana;
  t.mana = Math.max(0, t.mana - amount);
  log(`${name(t)} 因${s.name}失去 ${before - t.mana} 点魔力（剩余 ${t.mana}）`, 'spell');
}

function runTide(u, dec, s) {
  paySkillCost(u, s);
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) { log(`${name(u)} 的${s.name}失去目标`, 'note'); return; }
  t.atk += 2;
  log(`${name(u)} 对 ${name(t)} 使用${s.name}，本场攻击力 +2（当前 ${t.atk}）`, 'spell');
}

function runScorch(u, dec, s) {
  const t = resolveAttackTarget(u, dec, s.name, s.cost);
  if (!t) return;
  const hit = resolveAttackDamage(u, t, {
    label: s.name,
    power: u.atk,
    targetPartCellId: dec.targetPartCellId,
  });
  if (!hit) return;
  t.def = Math.max(0, t.def - 1);
  log(`${name(t)} 因${s.name}额外失去 1 点防御（剩余 ${t.def}）`, 'dmg');
}

function runBlast(u, dec, s) {
  const mana = u.mana;
  paySkillCost(u, s);
  const t = resolveAttackTarget(u, dec, s.name, {});
  if (!t) return;
  const amount = Math.floor(mana * 3 / 2);
  applyDamage(t, amount, u);
  log(`${name(u)} 对 ${name(t)} 使用${s.name}，消耗全部 ${mana} 点魔力，造成 ${amount} 点伤害`, 'spell');
}

function runBossWhip(u, dec) {
  payCost(u, { mana: 2 });
  const ids = Array.isArray(dec.targetUnitIds) ? dec.targetUnitIds : [];
  let targets = ids.map(id => units[id]).filter(t => t && t.alive && unitGap(u, t) <= u.atkRange);
  const taunts = tauntInRange(u);
  if (taunts.length) targets = [taunts.slice().sort((a, b) => (b.def - a.def) || (a.hp - b.hp))[0]];
  if (!targets.length) {
    log(`${name(u)} 的鞭挞没有目标`, 'note');
    return;
  }
  for (const t of targets) {
    if (!t.alive) continue;
    resolveAttackDamage(u, t, { label: '鞭挞', power: u.atk });
  }
}

function runBossPierce(u, dec) {
  const t = resolveAttackTarget(u, dec, '穿刺', { mana: 2 });
  if (!t) return;
  resolveAttackDamage(u, t, { label: '穿刺', power: u.atk, ignoreDef: true });
}

function runBossSuppress(u, dec) {
  payCost(u, { mana: 2 });
  const t = units[dec.targetUnitId];
  if (!t || !t.alive) {
    log(`${name(u)} 的压制失去目标`, 'note');
    return;
  }
  applyDamage(t, 1, u);
  t.status.apply('weak', 1, t);
  log(`${name(u)} 压制 ${name(t)}：1 点固定伤害并进入「无力」1 回合`, 'spell');
}

function runBossBurst(u) {
  payCost(u, { mana: 2 });
  let n = 0;
  for (const c of cells) if (setCellAttr(c, u.attr)) n++;
  log(`${name(u)} 爆发：${n} 个格子属性变为 ${ATTR_NAME[u.attr]}`, 'spell');
}

function runBossDrain(u) {
  let total = 0;
  for (const p of units) {
    if (!p.alive || p.camp === u.camp) continue;
    if (p.mana > 0) { p.mana -= 1; total += 1; }
  }
  u.mana = Math.min(u.maxMana, u.mana + total);
  log(`${name(u)} 抽取：${total} 点魔力被吸取，当前魔力 ${u.mana}/${u.maxMana}`, 'spell');
}

/* ---------------- 回合流程 ---------------- */
function nearestStepTo(u, target) {
  const cur = stepDist(u.cell, target.cell);
  let best = null;
  let bestD = cur;
  for (const id of u.cell.neighbors) {
    const c = cells[id];
    const d = stepDist(c, target.cell);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function npcFoes(u) {
  return aliveUnits().filter(x => x.camp !== u.camp);
}

function npcInRange(u, foes) {
  return foes.filter(f => unitGap(u, f) <= u.atkRange);
}

function npcNearest(u, foes) {
  return foes.reduce((a, b) => (stepDist(u.cell, a.cell) <= stepDist(u.cell, b.cell) ? a : b));
}

function npcStepToward(u, foes) {
  if (!foes.length) return null;
  const step = nearestStepTo(u, npcNearest(u, foes));
  return step ? { skillId: 16, targetCellId: step.id } : null;
}

function npcRandomDodge(u) {
  const opts = validCells(u, SKILL_MAP[2]);
  if (!opts.length) return null;
  return { skillId: 2, targetCellId: opts[Math.floor(Math.random() * opts.length)].id };
}

function npcHighestDefTarget(list) {
  return list.reduce((a, b) => (b.def > a.def || (b.def === a.def && b.hp < a.hp) ? b : a));
}

function npcLowestHpTarget(list) {
  return list.reduce((a, b) => (b.hp < a.hp ? b : a));
}

function npcDecideDefault(u) {
  const foes = npcFoes(u);
  if (!foes.length) return { skillId: 1 };
  const inRange = npcInRange(u, foes);
  if (u.mana >= SKILL_MAP[0].cost.mana && inRange.length) {
    return { skillId: 0, targetUnitId: npcLowestHpTarget(inRange).id };
  }
  if (u.mana >= SKILL_MAP[0].cost.mana) {
    const step = npcStepToward(u, foes);
    if (step) return step;
  }
  if (u.sta >= (SKILL_MAP[2].cost.sta || 0)) {
    const dodge = npcRandomDodge(u);
    if (dodge) return dodge;
  }
  return { skillId: 1 };
}

function npcDecideCorrode(u) {
  const foes = npcFoes(u);
  if (!foes.length) return { skillId: 4 };
  const inRange = npcInRange(u, foes);
  if (u.mana >= 2 && inRange.length) {
    return { action: 'corrode', targetUnitId: npcHighestDefTarget(inRange).id };
  }
  if (u.mana >= SKILL_MAP[0].cost.mana && inRange.length) {
    return { skillId: 0, targetUnitId: npcHighestDefTarget(inRange).id };
  }
  if (u.mana >= SKILL_MAP[0].cost.mana) {
    const step = npcStepToward(u, foes);
    if (step) return step;
  }
  if (u.sta >= (SKILL_MAP[2].cost.sta || 0)) {
    const dodge = npcRandomDodge(u);
    if (dodge) return dodge;
  }
  return { skillId: 4 };
}

function npcDecideTaunt() {
  return { action: 'taunt' };
}

function npcDecideTransform(u) {
  const foes = npcFoes(u);
  if (!foes.length) return { skillId: 1 };
  const inRange = npcInRange(u, foes);
  if (u.mana >= 2 && inRange.length) {
    const countered = inRange.filter(t => BEATS[u.attr] === t.attr);
    const pool = countered.length ? countered : inRange;
    return { action: 'transform', targetUnitId: npcLowestHpTarget(pool).id };
  }
  if (u.mana >= SKILL_MAP[0].cost.mana && inRange.length) {
    return { skillId: 0, targetUnitId: npcLowestHpTarget(inRange).id };
  }
  if (u.mana >= SKILL_MAP[0].cost.mana) {
    const step = npcStepToward(u, foes);
    if (step) return step;
  }
  if (u.sta >= (SKILL_MAP[2].cost.sta || 0)) {
    const dodge = npcRandomDodge(u);
    if (dodge) return dodge;
  }
  return { skillId: 4 };
}

function npcDecideBoss(u) {
  const foes = npcFoes(u);
  if (!foes.length) return { action: 'counter' };
  const inRange = npcInRange(u, foes);
  if (u.mana * 2 < u.maxMana) return { action: 'drain' };
  if (u.mana >= 2 && inRange.length) {
    if (Math.random() < 0.5) {
      const picks = shuffle(inRange).slice(0, 2);
      return { action: 'whip', targetUnitIds: picks.map(t => t.id) };
    }
    const target = inRange[Math.floor(Math.random() * inRange.length)];
    return { action: 'pierce', targetUnitId: target.id };
  }
  if (u.mana >= 2) {
    const action = ['counter', 'suppress', 'burst'][Math.floor(Math.random() * 3)];
    if (action === 'suppress') {
      const target = foes[Math.floor(Math.random() * foes.length)];
      return { action, targetUnitId: target.id };
    }
    return { action };
  }
  return { action: 'counter' };
}

function npcDecide(u) {
  const tpl = ENEMY_TEMPLATES[u.templateId] || ENEMY_TEMPLATES[1];
  return tpl.decide(u);
}

function startRound() {
  state.phase = 'decision';
  state.decisions = {};
  state.currentUnitId = null;
  state.onceUsed = false;
  draft = null;
  pendingRelic = null;
  hoverSkillId = null;
  lastSkill = null;
  log(`—— 第 ${state.round} 回合 ——`, 'round');

  for (const u of units) {
    if (!u.alive) continue;
    u.damageThisRound = 0;
    u.damageImmune = false;
    u.skipped = false;
    u.tauntUsed = false;
    if (!u.status.isNormal) {
      if (u.status.blocksDecision) {
        u.skipped = true;
        log(`${name(u)} 处于「${u.status.name}」，本回合无法行动`, 'note');
      }
      u.status.tick(u);
      if (u.status.isNormal) log(`${name(u)} 的「无力」状态结束`, 'note');
    }
  }

  for (const u of units) {
    if (u.alive && !u.skipped && u.camp === 1) state.decisions[u.id] = npcDecide(u);
  }
  updateAll();
  promptNext();
}

function promptNext() {
  if (state.over) return;
  const next = units.find(u => u.alive && !u.skipped && u.camp === 0 && !state.decisions[u.id]);
  if (!next) { resolveRound(); return; }
  state.currentUnitId = next.id;
  updateAll();
}

function commit(decision) {
  state.decisions[state.currentUnitId] = decision;
  draft = null;
  updateAll();
  promptNext();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function resolveRound() {
  state.phase = 'resolve';
  state.currentUnitId = null;
  updateAll();
  log('全员决策完成，开始结算', 'note');
  await sleep(320);

  const order = aliveUnits().sort((a, b) => a.id - b.id);
  for (const u of order) {
    if (!u.alive || u.skipped) continue;
    const d = state.decisions[u.id];
    if (!d) continue;
    const act = d.action ? ENEMY_ACTIONS[d.action] : null;
    const s = d.skillId !== undefined ? SKILL_MAP[d.skillId] : null;
    if (!act && !s) continue;
    state.currentUnitId = u.id;
    updateAll();
    await sleep(200);

    if (act) {
      act.run(u, d);
    } else if (s.type === 'defend') {
      log(`${name(u)} 保持防御姿态（${s.name}）`, 'note');
    } else {
      const fn = METHODS[s.method];
      if (fn) fn(u, d, s);
    }
    triggerInBattle();
    updateAll();
    await sleep(460);
  }

  for (const u of units) if (u.isBoss) bossEndRound(u);

  const mine = units.filter(u => u.alive && u.camp === 0).length;
  const foes = units.filter(u => u.alive && u.camp === 1).length;
  if (mine === 0 || foes === 0) {
    state.over = true;
    state.reason = 'wipe';
    state.winner = mine === 0 && foes === 0 ? 'draw' : (foes === 0 ? 0 : 1);
    await finishGame();
    return;
  }
  if (state.round >= MAX_ROUNDS) {
    state.over = true;
    state.reason = 'rounds';
    state.winner = 1;
    log(`已达 ${MAX_ROUNDS} 回合上限，主角阵营判负`, 'round');
    await finishGame();
    return;
  }
  state.round += 1;
  startRound();
}

function showWinPrompt() {
  winPrompt.classList.add('show');
  winPrompt.setAttribute('aria-hidden', 'false');
}

function hideWinPrompt() {
  winPrompt.classList.remove('show');
  winPrompt.setAttribute('aria-hidden', 'true');
}

function playVictoryCinematic() {
  return new Promise(resolve => {
    const bossVictory = units.some(u => u.isBoss);
    const lastUnit = units[lastPlayerDamagerId];
    const fallbackUnit = playerUnits[0];
    const sourceUnit = lastUnit && lastUnit.camp === 0 ? lastUnit : fallbackUnit;
    const src = bossVictory ? BOSS_WIN_VIDEO : (sourceUnit && sourceUnit.charId ? SETTLEMENT_VIDEO_BY_CHAR[sourceUnit.charId] : null);
    if (!src) { resolve(); return; }
    let done = false;
    let timer = null;
    const finish = () => {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      victoryVideo.removeEventListener('ended', finish);
      victoryVideo.removeEventListener('error', finish);
      victoryVideo.pause();
      victoryVideoBackdrop.pause();
      victoryCinematic.classList.remove('show');
      victoryCinematic.setAttribute('aria-hidden', 'true');
      resolve();
    };
    victoryCinematic.classList.add('show');
    victoryCinematic.setAttribute('aria-hidden', 'false');
    const videoSrc = encodeURI(src);
    victoryVideoBackdrop.src = videoSrc;
    victoryVideoBackdrop.load();
    victoryVideo.src = videoSrc;
    victoryVideo.load();
    victoryVideo.addEventListener('ended', finish);
    victoryVideo.addEventListener('error', finish);
    timer = setTimeout(finish, 12000);
    victoryVideoBackdrop.play().catch(() => {});
    victoryVideo.muted = false;
    victoryVideo.play().catch(() => {
      victoryVideo.muted = true;
      victoryVideo.play().catch(finish);
    });
  });
}

async function finishGame() {
  restoreBattleStats();
  updateAll();
  if (run.active) {
    run.phase = 'settle';
    const won = state.winner === 0;
    if (!won) clearSave();
    log(won ? '战斗胜利' : '战斗失败', 'round');
    if (won) {
      showWinPrompt();
      await sleep(800);
      await playVictoryCinematic();
      hideWinPrompt();
      showSettlement();
    } else {
      openModal('你输了', `在第 ${run.stageIndex + 1} 层倒下了。`, [
        { label: '回到启动页面', primary: true, onClick: backToStart },
      ]);
    }
    return;
  }
  const title = state.winner === 'draw' ? '平 局' : (state.winner === 0 ? '胜 利' : '战 败');
  bannerTitle.textContent = title;
  bannerTitle.style.color = state.winner === 'draw' ? '#cbd6e6' : (state.winner === 0 ? '#7fe0c0' : '#f08a8a');
  bannerSub.textContent = state.reason === 'rounds'
    ? `超出 ${MAX_ROUNDS} 回合，主角阵营判负`
    : `共 ${state.round} 回合`;
  banner.classList.add('show');
  log(`对局结束：${title}`, 'round');
}

function pickables() {
  const list = cellMeshes.filter(Boolean);
  units.forEach(u => {
    if (!u.alive || !u.mesh) return;
    const gems = u.mesh.userData.gems || [u.mesh.userData.gem];

  });

function chooseSkill(s) {
  const actor = currentActor();
  if (!actor || state.phase !== 'decision' || actor.camp !== 0 || actor.skipped) return;
  pendingRelic = null;
  lastSkill = { skillId: s.id, unitId: actor.id };
  draft = { skill: s, unit: actor };
  updateAll();
}

function draftReady() {
  if (!draft) return false;
  const t = draft.skill.target;
  if (t === 'none') return true;
  if (t === 'enemy' || t === 'ally') return draft.targetUnitId !== undefined;
  if (t === 'cell') return draft.targetCellId !== undefined;
  return false;
}

function confirmDecision() {
  if (state.phase !== 'decision' || !draftReady()) return;
  const dec = { skillId: draft.skill.id };
  if (draft.targetUnitId !== undefined) dec.targetUnitId = draft.targetUnitId;
  if (draft.targetCellId !== undefined) dec.targetCellId = draft.targetCellId;
  if (draft.targetPartCellId !== undefined) dec.targetPartCellId = draft.targetPartCellId;
  commit(dec);
}

function updateFoot() {
  if (state.phase === 'deploy' && deployment) {
    const left = deployment.order.length - deployment.index;
    draftInfo.textContent = left > 0 ? `待布阵 ${left} 人` : '全员已就位';
    confirmBtn.disabled = left > 0;
    confirmBtn.textContent = '开始战斗';
    return;
  }
  confirmBtn.textContent = '确定决策';
  const actor = currentActor();
  const isPlayerTurn = state.phase === 'decision' && !state.over && actor && actor.camp === 0 && !actor.skipped;
  confirmBtn.disabled = !(isPlayerTurn && draftReady());

  if (!isPlayerTurn || !draft) {
    draftInfo.textContent = isPlayerTurn ? '未选择技能' : '等待行动';
    return;
  }
  const s = draft.skill;
  let t = s.name;
  if (draft.targetUnitId !== undefined) t += ` → ${units[draft.targetUnitId].name}`;
  if (draft.targetCellId !== undefined) t += ` → ${cells[draft.targetCellId].label}`;
  draftInfo.innerHTML = `已选：<b>${t}</b>${draftReady() ? '' : ' · 待选择目标'}`;
}

renderer.domElement.addEventListener('pointerdown', ev => {
  if (state.phase === 'deploy') {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables(), false);
    for (const hit of hits) {
      const { cellId, unitId } = hit.object.userData;
      if (unitId !== undefined) {
        const u = units[unitId];
        if (u && u.alive && u.camp === 0 && deployment) {
          const i = deployment.order.indexOf(u);
          if (i >= 0 && i !== deployment.index) {
            selectDeployUnit(u);
            return;
          }
        }
      }
      const id = cellId !== undefined ? cellId : (unitId !== undefined ? units[unitId].cell.id : undefined);
      if (id === undefined) continue;
      placeCurrent(cells[id]);
      return;
    }
    return;
  }
  if (!draft && !pendingRelic) return;
  if (draft && draft.skill.target === 'none') return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables(), false);
  if (!hits.length) return;

  if (pendingRelic) {
    const a = ARTIFACTS[pendingRelic.id];
    for (const hit of hits) {
      const { unitId } = hit.object.userData;
      if (unitId === undefined) continue;
      const u = units[unitId];
      if (!u || !u.alive) continue;
      if (a.target === 'ally' && u.camp !== 0) continue;
      if (a.target === 'enemy' && u.camp !== 1) continue;
      useOnceArtifact(pendingRelic.id, u);
      return;
    }
    return;
  }

  const s = draft.skill;
  const actor = draft.unit;

  for (const hit of hits) {
    const { unitId, cellId } = hit.object.userData;
    if (s.target === 'enemy' || s.target === 'ally') {
      if (unitId === undefined) continue;
      if (!validTargets(actor, s).some(u => u.id === unitId)) continue;
      const targetUnit = units[unitId];
      const partCellId = hit.object.userData.partCellId;
      if (targetUnit && targetUnit.isBoss && partCellId !== undefined) {
        if (stepDist(actor.cell, cells[partCellId]) > actor.atkRange) continue;
      }
      draft.targetUnitId = unitId;
      draft.targetCellId = undefined;
      draft.targetPartCellId = targetUnit && targetUnit.isBoss ? partCellId : undefined;
      updateAll();
      return;
    }
    if (s.target === 'cell') {
      const id = cellId !== undefined ? cellId : (unitId !== undefined ? units[unitId].cell.id : undefined);
      if (id === undefined) continue;
      if (!validCells(actor, s).some(c => c.id === id)) continue;
      draft.targetCellId = id;
      updateAll();
      return;
    }
  }
});

const LEVEL_ELEMENTS = ['金', '木', '水', '火', '土'];
const LEVEL_DIR_URL = '/' + encodeURIComponent('关卡集') + '/';

function levelFileForLayer(layer) {
  const idx = Math.floor(rnd('level:' + layer) * LEVEL_ELEMENTS.length) % LEVEL_ELEMENTS.length;
  const elem = LEVEL_ELEMENTS[idx];
  if (layer >= RUN_LAYERS) return `关卡${layer}-${elem}boss.json`;
  const candidates = [layer - 1, layer, layer + 1].filter(n => n >= 1 && n < RUN_LAYERS);
  const pick = candidates[Math.floor(rnd('levelNum:' + layer) * candidates.length) % candidates.length];
  return `关卡${pick}-${elem}.json`;
}

async function loadLevelForLayer(layer) {
  const file = levelFileForLayer(layer);
  const res = await fetch(LEVEL_DIR_URL + encodeURIComponent(file), { cache: 'no-store' });
  if (!res.ok) throw new Error(`关卡文件 ${file} 读取失败（HTTP ${res.status}）`);
  const data = await res.json();
  if (!data || !Array.isArray(data.cells) || data.cells.length !== 51 || !Array.isArray(data.enemies)) {
    throw new Error(`关卡文件 ${file} 格式不正确`);
  }
  return { ...data, file };
}

class RogueRun {
  constructor(difficulty, luckBonus = 0) {
    this.difficulty = Math.max(CONFIG.difficulty.min, Math.min(CONFIG.difficulty.max, difficulty | 0));
    this.luckBonus = luckBonus;
    this.luck = Math.max(0, CONFIG.luck.base - CONFIG.luck.perDifficulty * this.difficulty + luckBonus);
    this.layers = Array.from({ length: RUN_LAYERS }, () => []);
    this.index = new Map();
    this.seq = 0;
    this.generate();
  }

  get extraChance() {
    const v = 0.5 + (this.luck - CONFIG.luck.pivot) * CONFIG.luck.chancePerPoint;
    return Math.min(CONFIG.luck.max, Math.max(CONFIG.luck.min, v));
  }

  node(layer, type) {
    const key = layer + ':' + type;
    if (!this.index.has(key)) {
      const n = { id: this.seq++, layer, type, children: [] };
      this.index.set(key, n);
      this.layers[layer].push(n);
    }
    return this.index.get(key);
  }

  childTypes(type) {
    const p = this.extraChance;
    if (type === 'fight') {
      return ['fight', 'rest', ...(Math.random() < p * 0.5 ? ['event'] : [])];
    }
    if (type === 'event') return ['fight', 'rest'];
    if (type === 'rest') return ['fight', ...(Math.random() < p ? ['event'] : [])];
    return [];
  }

  generate() {
    const first = this.node(0, 'fight');
    let prev = [first];
    for (let layer = 1; layer < BOSS_LAYER; layer++) {
      for (const n of prev) {
        n.children = this.childTypes(n.type).map(t => this.node(layer, t));
      }
      prev = this.layers[layer].slice();
    }
    const boss = this.node(BOSS_LAYER, 'boss');
    for (const n of prev) n.children = [boss];
  }

  options(path) {
    if (!path.length) return this.layers[0];
    return path[path.length - 1].children;
  }

  static fromJSON(d) {
    const r = Object.create(RogueRun.prototype);
    r.difficulty = d.difficulty;
    r.luckBonus = d.luckBonus || 0;
    r.luck = Math.max(0, CONFIG.luck.base - CONFIG.luck.perDifficulty * d.difficulty + r.luckBonus);
    r.index = new Map();
    r.seq = 0;
    r.layers = (d.layers || []).map((nodes, layer) => nodes.map(n => {
      const node = { id: n.id, layer, type: n.type, children: [] };
      r.index.set(n.id, node);
      return node;
    }));
    for (const [id, kids] of Object.entries(d.children || {})) {
      const n = r.index.get(Number(id));
      if (n) n.children = kids.map(k => r.index.get(k)).filter(Boolean);
    }
    return r;
  }
}

function currentLuck() {
  if (run.rogue) return run.rogue.luck;
  return Math.max(0, CONFIG.luck.base - CONFIG.luck.perDifficulty * run.difficulty + run.luckBonus);
}

function fortuneWeight(f) {
  const d = (currentLuck() - 35) / 5;
  switch (f.key) {
    case 'great': return Math.max(0, 10 + d);
    case 'good': return Math.max(0, 20 + d * 2);
    case 'small': return Math.max(0, 40 + d * 4);
    case 'bad': return Math.max(0, 20 - d * 2);
    case 'awful': return Math.max(0, 10 - d);
    default: return 0;
  }
}

function pickFortune(tag) {
  const total = FORTUNES.reduce((n, f) => n + fortuneWeight(f), 0);
  let r = rnd(tag) * total;
  for (const f of FORTUNES) {
    r -= fortuneWeight(f);
    if (r < 0) return f;
  }
  return FORTUNES[FORTUNES.length - 1];
}
